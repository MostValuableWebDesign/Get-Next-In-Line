          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRegionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRegion"
        "403":
          description: Requires Super Admin
        "409":
          description: Region name already exists in this org

  /franchise/orgs/{orgId}/storefronts:
    post:
      operationId: attachFranchiseStorefront
      tags: [franchise]
      summary: Attach an existing tenant as a storefront (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseStorefrontAttach"
      responses:
        "201":
          description: Attached (active templates deploy automatically)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseStorefront"
        "403":
          description: Requires Super Admin
        "409":
          description: Tenant already belongs to an organization

  /franchise/orgs/{orgId}/storefronts/{tenantId}:
    patch:
      operationId: updateFranchiseStorefront
      tags: [franchise]
      summary: Move a storefront between regions (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseStorefrontUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseStorefront"
        "403":
          description: Requires Super Admin
        "404":
          description: Not found
    delete:
      operationId: detachFranchiseStorefront
      tags: [franchise]
      summary: Detach a storefront (its template-derived perks are retired)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Detached
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/roles:
    get:
      operationId: listFranchiseRoles
      tags: [franchise]
      summary: List role assignments (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseRoleEntry"
        "403":
          description: Requires Super Admin
    post:
      operationId: assignFranchiseRole
      tags: [franchise]
      summary: Assign an org role to a user (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRoleAssign"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRoleEntry"
        "403":
          description: Requires Super Admin
        "409":
          description: User already has a role in this org

  /franchise/orgs/{orgId}/roles/{roleId}:
    delete:
      operationId: removeFranchiseRole
      tags: [franchise]
      summary: Remove a role assignment (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/templates:
    get:
      operationId: listFranchiseTemplates
      tags: [franchise]
      summary: Perk templates with per-location deployment status (scoped to the caller's role)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: No role in this org
    post:
      operationId: createFranchiseTemplate
      tags: [franchise]
      summary: Define & deploy a global perk template to every storefront (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseTemplateCreate"
      responses:
        "201":
          description: Created & deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: Requires Super Admin

  /franchise/orgs/{orgId}/templates/{templateId}:
    patch:
      operationId: updateFranchiseTemplate
      tags: [franchise]
      summary: Update or retire/reactivate a template — changes propagate to every deployed location (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseTemplateUpdate"
      responses:
        "200":
          description: Updated & propagated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/requests:
    get:
      operationId: listFranchiseRequests
      tags: [franchise]
      summary: Local-partnership approval queue, scoped to the caller's role
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchisePartnershipRequest"
        "403":
          description: No role in this org
    post:
      operationId: createFranchiseRequest
      tags: [franchise]
      summary: Storefront-initiated local partnership (zip-code proximity enforced; outcome depends on the org autonomy policy)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRequestCreate"
      responses:
        "201":
          description: Created — approved immediately under the allowed policy, queued under approval_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchisePartnershipRequest"
        "400":
          description: Zip-code mismatch or invalid body
        "403":
          description: Autonomy locked, or storefront outside the caller's scope

  /franchise/orgs/{orgId}/requests/{requestId}/decide:
    post:
      operationId: decideFranchiseRequest
      tags: [franchise]
      summary: Approve or reject a queued local-partnership request (Regional Manager of that region or Super Admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRequestDecision"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchisePartnershipRequest"
        "403":
          description: Outside the caller's scope
        "404":
          description: Not found
        "409":
          description: Already decided

  /franchise/orgs/{orgId}/rollup:
    get:
      operationId: getFranchiseRollup
      tags: [franchise]
      summary: Consolidated cross-promotion / redemption / revenue roll-up, region- and storefront-broken-down, scoped to the caller's role
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roll-up report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRollup"
        "403":
          description: No role in this org


  # ── Co-Op Supplier & Procurement Marketplace ────────────────────────────────
  /admin/procurement/vendors:
    get:
      operationId: listAdminProcurementVendors
      tags: [admin]
      summary: Admin-only — full B2B vendor directory including unverified drafts, with supply items
      responses:
        "200":
          description: All vendors with their supply items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementVendor"
    post:
      operationId: createProcurementVendor
      tags: [admin]
      summary: Admin-only — add a regional B2B vendor to the directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementVendorCreate"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementVendor"
        "400":
          description: Invalid body

  /admin/procurement/vendors/{id}:
    patch:
      operationId: updateProcurementVendor
      tags: [admin]
      summary: Admin-only — edit a vendor (including the verified flag)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementVendorUpdate"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementVendor"
        "400":
          description: Invalid body
        "404":
          description: Unknown vendor

  /admin/procurement/vendors/{id}/items:
    post:
      operationId: createProcurementVendorItem
      tags: [admin]
      summary: Admin-only — add a supply item (with bulk pricing tiers) to a vendor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementVendorItemCreate"
      responses:
        "201":
          description: Supply item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementVendorItem"
        "400":
          description: Invalid body or malformed bulk tiers
        "404":
          description: Unknown vendor

  /admin/procurement/vendor-items/{id}:
    patch:
      operationId: updateProcurementVendorItem
      tags: [admin]
      summary: Admin-only — edit a vendor supply item / its bulk tiers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementVendorItemUpdate"
      responses:
        "200":
          description: Updated supply item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementVendorItem"
        "400":
          description: Invalid body
        "404":
          description: Unknown item

  /admin/procurement/overview:
    get:
      operationId: getAdminProcurementOverview
      tags: [admin]
      summary: Admin-only — network-wide view of active group buys and cumulative co-op savings
      responses:
        "200":
          description: Marketplace overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementAdminOverview"

  /coop/procurement/vendors:
    get:
      operationId: listProcurementVendors
      tags: [coop]
      summary: Merchant-facing — verified, active vendors and their supply items only; tenant scope via x-tenant-id
      responses:
        "200":
          description: Verified vendor directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementVendor"
        "400":
          description: Missing x-tenant-id header

  /coop/procurement/group-buys:
    get:
      operationId: listProcurementGroupBuys
      tags: [coop]
      summary: Merchant-facing — open group buys across the network plus this tenant's closed ones; tenant scope via x-tenant-id
      responses:
        "200":
          description: Group buys with live volume-discount tier progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementGroupBuy"
        "400":
          description: Missing x-tenant-id header
    post:
      operationId: createProcurementGroupBuy
      tags: [coop]
      summary: Merchant-facing — open a group buy on a vendor supply item (organizer joins with an initial quantity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementGroupBuyCreate"
      responses:
        "201":
          description: Group buy opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementGroupBuy"
        "400":
          description: Invalid body or missing x-tenant-id header
        "403":
          description: Tenant is not part of the co-op network
        "404":
          description: Unknown or unavailable vendor item

  /coop/procurement/group-buys/{id}/join:
    post:
      operationId: joinProcurementGroupBuy
      tags: [coop]
      summary: Merchant-facing — join an open group buy or adjust this tenant's pooled quantity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementGroupBuyJoin"
      responses:
        "200":
          description: Updated group buy with live tier progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementGroupBuy"
        "400":
          description: Invalid quantity or missing x-tenant-id header
        "403":
          description: Tenant is not part of the co-op network
        "404":
          description: Unknown group buy
        "409":
          description: Group buy is no longer open

  /coop/procurement/group-buys/{id}/close:
    post:
      operationId: closeProcurementGroupBuy
      tags: [coop]
      summary: Merchant-facing — organizer closes the group buy; the achieved bulk tier is computed and the immutable cost-split ledger is generated
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Closed group buy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementGroupBuy"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Only the organizer can close a group buy
        "404":
          description: Unknown group buy
        "409":
          description: Group buy already closed

  /coop/procurement/group-buys/{id}/ledger:
    get:
      operationId: getProcurementGroupBuyLedger
      tags: [coop]
      summary: Merchant-facing — cost-split ledger for a closed group buy; the organizer sees every line, participants see their own
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ledger view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementLedgerView"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Tenant did not participate in this group buy
        "404":
          description: Unknown group buy
        "409":
          description: Group buy is still open — no ledger yet

  /coop/procurement/ledger:
    get:
      operationId: listProcurementLedger
      tags: [coop]
      summary: Merchant-facing — this tenant's cost-split ledger lines across all closed group buys
      responses:
        "200":
          description: Ledger lines, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementLedgerEntry"
        "400":
          description: Missing x-tenant-id header

  /coop/procurement/supplies:
    get:
      operationId: listProcurementSupplies
      tags: [coop]
      summary: Merchant-facing — this tenant's tracked supply items with low-stock flags
      responses:
        "200":
          description: Supply items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementSupplyItem"
        "400":
          description: Missing x-tenant-id header
    post:
      operationId: createProcurementSupply
      tags: [coop]
      summary: Merchant-facing — track a new essential supply item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementSupplyCreate"
      responses:
        "201":
          description: Supply item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementSupplyItem"
        "400":
          description: Invalid body or missing x-tenant-id header
        "404":
          description: Linked vendor item not found or not orderable

  /coop/procurement/supplies/{id}:
    patch:
      operationId: updateProcurementSupply
      tags: [coop]
      summary: Merchant-facing — adjust on-hand quantity, threshold, vendor-item link, or auto-request mode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementSupplyUpdate"
      responses:
        "200":
          description: Updated supply item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementSupplyItem"
        "400":
          description: Invalid body or missing x-tenant-id header
        "404":
          description: Unknown supply item (or not this tenant's)

  /coop/procurement/supplies/{id}/replenish:
    post:
      operationId: replenishProcurementSupply
      tags: [coop]
      summary: Merchant-facing — one-click replenishment; joins an open group buy for the linked vendor item or opens a new one
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementReplenishRequest"
      responses:
        "200":
          description: Replenishment group buy created or joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementReplenishResult"
        "400":
          description: Supply not linked to a vendor item, invalid quantity, or missing x-tenant-id header
        "403":
          description: Tenant is not part of the co-op network
        "404":
          description: Unknown supply item (or not this tenant's)

components:
  schemas:
    WorkforceCapability:
      type: string
      enum:
        [
          employees,
          contractors,
          payroll,
          compensation,
          onboarding,
          benefits,
          tax_documents,
          time_tracking,
          time_off,
          scheduling,
        ]

    OperationsProvider:
      type: object
      required:
        [
          providerId,
          name,
          description,
          preferred,
          status,
          capabilities,
          scopes,
          connectedAt,
          lastSuccessfulSyncAt,
          lastError,
        ]
      properties:
        providerId:
          type: string
        name:
          type: string
        description:
          type: string
        preferred:
          type: boolean
        status:
          type: string
          enum:
            [
              not_connected,
              connecting,
              connected,
              syncing,
              degraded,
              reauthorization_required,
              error,
            ]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/WorkforceCapability"
        scopes:
          type: array
          items:
            type: string
        connectedAt:
          type: ["string", "null"]
          format: date-time
        lastSuccessfulSyncAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]

    OperationsCapabilityAssignment:
      type: object
      required: [capability, providerId, providerName, state, providerStatus, missingScopes, syncStatus, syncLastError]
      properties:
        capability:
          $ref: "#/components/schemas/WorkforceCapability"
        providerId:
          type: ["string", "null"]
        providerName:
          type: ["string", "null"]
        state:
          type: string
          enum: [connected, unavailable, missing_scope, failed]
        providerStatus:
          type: ["string", "null"]
        missingScopes:
          type: array
          items:
            type: string
        syncStatus:
          type: ["string", "null"]
        syncLastError:
          type: ["string", "null"]

    OperationsOverview:
      type: object
      required:
        [
          providers,
          capabilityAssignments,
          connectedProviderCount,
          attentionRequiredCount,
          lastSuccessfulSyncAt,
          workforceCount,
          unlinkedWorkforceCount,
        ]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OperationsProvider"
        capabilityAssignments:
          type: array
          items:
            $ref: "#/components/schemas/OperationsCapabilityAssignment"
        connectedProviderCount:
          type: integer
        attentionRequiredCount:
          type: integer
        lastSuccessfulSyncAt:
          type: ["string", "null"]
          format: date-time
        workforceCount:
          type: integer
        unlinkedWorkforceCount:
          type: integer

    OperationsCapabilitySyncResult:
      type: object
      required: [providerId, tenantId, startedAt, completedAt, status, recordsRead, recordsWritten, errors]
      properties:
        providerId:
          type: string
        tenantId:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [succeeded, partially_succeeded, failed]
        recordsRead:
          type: integer
        recordsWritten:
          type: integer
        errors:
          type: array
          items:
            type: string

    OperationsPayrollRun:
      type: object
      required:
        [id, status, payPeriodStart, payPeriodEnd, paymentDate, processed, processedDate, calculatedAt, grossPayCents, netPayCents, currency, lastSyncedAt]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [draft, processing, processed, paid, cancelled, unknown]
        payPeriodStart:
          type: string
        payPeriodEnd:
          type: string
        paymentDate:
          type: ["string", "null"]
        processed:
          type: boolean
        processedDate:
          type: ["string", "null"]
        calculatedAt:
          type: ["string", "null"]
          format: date-time
        grossPayCents:
          type: ["string", "null"]
          pattern: "^[0-9]+$"
        netPayCents:
          type: ["string", "null"]
          pattern: "^[0-9]+$"
        currency:
          type: string
        lastSyncedAt:
          type: string
          format: date-time

    OperationsCompensation:
      type: object
      required: [id, workforcePersonId, displayName, amountCents, currency, interval, effectiveFrom, effectiveTo, lastSyncedAt]
      properties:
        id:
          type: integer
        workforcePersonId:
          type: ["integer", "null"]
        displayName:
          type: ["string", "null"]
        amountCents:
          type: string
          pattern: "^[0-9]+$"
        currency:
          type: string
        interval:
          type: string
          enum: [hourly, weekly, monthly, annual, paycheck, unknown]
        effectiveFrom:
          type: ["string", "null"]
        effectiveTo:
          type: ["string", "null"]
        lastSyncedAt:
          type: string
          format: date-time

    GustoConnectResult:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string

    GustoConnectionStatus:
      type: object
      required:
        [
          providerId,
          state,
          providerAccountId,
          scopes,
          connectedAt,
          lastSuccessfulSyncAt,
          lastSyncAttemptAt,
          lastError,
        ]
      properties:
        providerId:
          type: string
        state:
          type: string
          enum:
            [
              not_connected,
              connecting,
              connected,
              syncing,
              degraded,
              reauthorization_required,
