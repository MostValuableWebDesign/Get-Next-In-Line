          type: string
        phone:
          type: string
        email:
          type: string
        smsOptIn:
          type: boolean
        emailOptIn:
          type: boolean

    SosVisit:
      type: object
      required: [id, customerId, customerName, status, serviceType, partySize, checkedInAt]
      properties:
        id:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        status:
          type: string
          enum: [checked_in, queued, assigned, notified, in_service, payment, checked_out]
        serviceType:
          type: string
        partySize:
          type: integer
        resourceId:
          type: ["integer", "null"]
        resourceName:
          type: ["string", "null"]
        staffId:
          type: ["integer", "null"]
        staffName:
          type: ["string", "null"]
        estimatedWaitMinutes:
          type: ["integer", "null"]
        paymentAmount:
          type: ["number", "null"]
        # Gratuity captured at checkout — separate from service revenue.
        tipAmount:
          type: ["number", "null"]
        # Co-op shared-appointment bundle membership (null = standalone).
        bundleId:
          type: ["integer", "null"]
        checkedInAt:
          type: string
        serviceStartedAt:
          type: ["string", "null"]
        checkedOutAt:
          type: ["string", "null"]
        # Outcome of the customer SMS dispatched by this transition (only set
        # on the response to a "notify" advance). Lets staff see immediately
        # when the "you're next" text could not be delivered.
        notification:
          type: ["object", "null"]
          required: [attempted, status]
          properties:
            attempted:
              type: boolean
            status:
              type: ["string", "null"]
            error:
              type: ["string", "null"]

    SosVisitInput:
      type: object
      required: [customerId, serviceType]
      properties:
        customerId:
          type: integer
        serviceType:
          type: string
          minLength: 1
        partySize:
          type: integer
        estimatedWaitMinutes:
          type: integer

    SosVisitAdvance:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [queue, assign, notify, start_service, request_payment, check_out]
        resourceId:
          type: integer
        paymentAmount:
          type: number
        # Optional gratuity captured at check_out — recorded separately from
        # service revenue and pooled/split via the gratuity ledger.
        tipAmount:
          type: number
          minimum: 0
        # Optional per-visit override of the tenant's default tip-split rule.
        tipSplitRule:
          type: string
          enum: [equal, percentage, role_weighted]
        # Optional staff attribution captured at payment/checkout.
        staffId:
          type: integer
        # Optional plan benefit to apply at check_out: redeem one prepaid
        # credit from a package/pass, or apply a membership discount.
        benefitCustomerPlanId:
          type: integer
        benefitType:
          type: string
          enum: [redeem_credit, membership_discount]

    SosStaffMember:
      type: object
      required:
        [id, name, phone, email, isActive, compensationType, commissionPercent, amount, cadence,
         tipPercent, tipRoleWeight,
         skills, certifications, licenseNumber, licenseState, licenseExpiresAt, licenseStatus,
         licenseVerifiedBy, licenseVerifiedAt, coopCoverageEnabled, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        isActive:
          type: boolean
        compensationType:
          type: string
          enum: [commission, flat_fee, booth_rent]
        # commission only — percentage of attributed service revenue.
        commissionPercent:
          type: ["integer", "null"]
        # flat_fee / booth_rent only — money amount per cadence.
        amount:
          type: ["number", "null"]
        # flat_fee / booth_rent only.
        cadence:
          type: ["string", "null"]
          enum: [weekly, monthly, null]
        # Tip pooling: percentage-rule share (whole-number %). NULL = excluded
        # from percentage splits.
        tipPercent:
          type: ["integer", "null"]
        # Tip pooling: role weight for the role_weighted rule. NULL = weight 1.
        tipRoleWeight:
          type: ["integer", "null"]
        # ── Credential registry (co-op shift coverage) ──────────────────────
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        licenseNumber:
          type: ["string", "null"]
        licenseState:
          type: ["string", "null"]
        licenseExpiresAt:
          type: ["string", "null"]
        # Effective status — "expired" is derived from licenseExpiresAt.
        licenseStatus:
          type: string
          enum: [unverified, verified, expired]
        licenseVerifiedBy:
          type: ["string", "null"]
        licenseVerifiedAt:
          type: ["string", "null"]
        coopCoverageEnabled:
          type: boolean
        createdAt:
          type: string

    SosStaffMemberInput:
      type: object
      required: [name, compensationType]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
        compensationType:
          type: string
          enum: [commission, flat_fee, booth_rent]
        commissionPercent:
          type: integer
          minimum: 0
          maximum: 100
        amount:
          type: number
          minimum: 0
        cadence:
          type: string
          enum: [weekly, monthly]
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        licenseNumber:
          type: string
        licenseState:
          type: string
        licenseExpiresAt:
          type: string
        coopCoverageEnabled:
          type: boolean

    SosStaffMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        compensationType:
          type: string
          enum: [commission, flat_fee, booth_rent]
        commissionPercent:
          type: integer
          minimum: 0
          maximum: 100
        amount:
          type: number
          minimum: 0
        cadence:
          type: string
          enum: [weekly, monthly]
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        # Editing any license field resets verification to unverified.
        licenseNumber:
          type: ["string", "null"]
        licenseState:
          type: ["string", "null"]
        licenseExpiresAt:
          type: ["string", "null"]
        coopCoverageEnabled:
          type: boolean

    SosStaffLicenseVerify:
      type: object
      required: [verifiedBy]
      properties:
        verifiedBy:
          type: string
          minLength: 1

    CoopCoverageShiftCreate:
      type: object
      required: [startsAt, endsAt, requiredSkill, offeredHourlyRate]
      properties:
        startsAt:
          type: string
        endsAt:
          type: string
        requiredSkill:
          type: string
          minLength: 1
        # Defaults to the posting business's own state (addressRegion).
        requiredLicenseState:
          type: string
        offeredHourlyRate:
          type: number
          minimum: 0
        notes:
          type: string

    CoopCoverageOfferCreate:
      type: object
      required: [staffId]
      properties:
        staffId:
          type: integer
        note:
          type: string

    CoopCoverageComplete:
      type: object
      required: [hoursWorked]
      properties:
        hoursWorked:
          type: number
          minimum: 0

    CoopCoverageRatingCreate:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    CoopCoverageStaffCard:
      type: object
