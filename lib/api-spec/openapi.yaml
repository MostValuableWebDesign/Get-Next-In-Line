openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Get Next In Line — GHL + GNIL OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agency
    description: Agency command center
  - name: tenants
    description: Tenant provisioning and management
  - name: modules
    description: Service modules and pricing
  - name: billing
    description: Billing and checkout simulation
  - name: admin
    description: Admin-only operations (never exposed to tenants)
  - name: partners
    description: Partner-Direct Integrations — connection handshakes and status (webhook listener is server-to-server only, outside this spec)
  - name: sos
    description: SOS operations platform — resources, visits, waitlist, appointments, AI receptionist
  - name: gateway
    description: Co-Op API & Third-Party POS Integration Gateway — bearer-token management and API call log (public /v1/gateway endpoints are server-to-server, outside this spec)
  - name: public-booking
    description: Public (no-login) direct-booking flow — service menu, availability, and booking keyed by tenant slug

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agency/dashboard:
    get:
      operationId: getAgencyDashboard
      tags: [agency]
      summary: Get agency dashboard summary — MRR, tenant counts, revenue totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyDashboard"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [agency]
      summary: Get global agency settings including markup percentage
      responses:
        "200":
          description: Agency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
    patch:
      operationId: updateAgencySettings
      tags: [agency]
      summary: Update global agency settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all provisioned tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/activity:
    get:
      operationId: getTenantActivity
      tags: [tenants]
      summary: Recent tenant provisioning and status change activity feed
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Filter activity to a single tenant
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_timestamp
          in: query
          required: false
          description: Keyset cursor — return items strictly older than this (timestamp, id) pair. Must be paired with before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Keyset cursor id tiebreaker; must be paired with before_timestamp.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantActivityPage"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a single tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Remove a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tenants/{id}/modules:
    get:
      operationId: getTenantModules
      tags: [tenants]
      summary: List modules a tenant is subscribed to
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules the tenant is subscribed to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSubscribedModule"
        "404":
          description: Tenant not found

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all service modules with wholesale and resale pricing
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/pricing:
    get:
      operationId: getModulesPricing
      tags: [modules]
      summary: Get all module pricing with current markup applied
      responses:
        "200":
          description: Pricing with markup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModulePricing"

  /modules/tenant-counts:
    get:
      operationId: getModuleTenantCounts
      tags: [modules]
      summary: Get count of active tenants subscribed to each module
      responses:
        "200":
          description: Per-module active tenant counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantCount"

  /modules/{id}/tenants:
    get:
      operationId: getModuleTenants
      tags: [modules]
      summary: List tenants subscribed to a module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenants subscribed to the module
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantSubscriber"
        "404":
          description: Module not found

  /admin/connector-registry:
    get:
      operationId: getConnectorRegistry
      tags: [admin]
      summary: Admin-only — full module list including hidden upstream connector mapping
      responses:
        "200":
          description: Modules with hidden connector details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorRegistryEntry"

  /admin/connector-registry/{id}:
    patch:
      operationId: updateConnectorRegistryEntry
      tags: [admin]
      summary: Admin-only — update a module's hidden connector details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRegistryEntryUpdate"
      responses:
        "200":
          description: Updated registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRegistryEntry"
        "404":
          description: Not found

  /admin/modules/{id}:
    get:
      operationId: getAdminModuleDetail
      tags: [admin]
      summary: Admin-only — module connector mapping, tenant assignments, and provisioning activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connector-aware module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModuleDetail"
        "404":
          description: Module not found

  /coop/partnerships:
    get:
      operationId: listCoopPartnerships
      tags: [admin]
      summary: List the scoped tenant's co-op partnerships (as host or partner); tenant context required via x-tenant-id header or tenantId query
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Tenant scope fallback when no x-tenant-id header is set; must match the header when both are present.
          schema:
            type: integer
      responses:
        "200":
          description: Partnerships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPartnership"
    post:
      operationId: createCoopPartnership
      tags: [admin]
      summary: Create a merchant co-op partnership between two tenants (industry barrier enforced unless overridden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipCreate"
      responses:
        "201":
          description: Created partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Host or partner tenant not found
        "409":
          description: Industry barrier — both tenants share a module category and no override was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopIndustryBarrierError"

  /coop/partnerships/{id}:
    patch:
      operationId: updateCoopPartnership
      tags: [admin]
      summary: Edit a partnership's perk or activate/deactivate it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipUpdate"
      responses:
        "200":
          description: Updated partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Not found

  /coop/partnerships/{id}/reactivate:
    post:
      operationId: reactivateCoopPartnership
      tags: [coop]
      summary: Request (or complete, when the other side already requested) mutual reactivation of a performance-paused partnership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership after the request was recorded or the pause was lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing tenant context
        "403":
          description: Caller is not a participant
        "404":
          description: Not found
        "409":
          description: Not performance-paused, or banned

  /coop/taxonomy:
    get:
      operationId: getCoopTaxonomy
      tags: [coop]
      summary: Curated two-level co-op taxonomy (Industry → Sub-Category)
      responses:
        "200":
          description: Taxonomy industries with their sub-categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopTaxonomyIndustry"

  /coop/ledger:
    get:
      operationId: getCoopLedger
      tags: [coop]
      summary: Merchant-facing — per-partnership inbound/outbound traffic counts, ratio, disparity, and imbalance flags; tenant scope via x-tenant-id
      parameters:
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Traffic ledger for partnerships the tenant participates in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopLedgerResponse"
        "400":
          description: Missing x-tenant-id header

  /coop/partnerships/{id}/renegotiate:
    post:
      operationId: proposeCoopRenegotiation
      tags: [coop]
      summary: Merchant-facing — propose revised perk/mutual-reward terms; they only replace live terms when the partner accepts; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopRenegotiationPropose"
      responses:
        "200":
          description: Partnership with the pending proposal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header or empty proposal
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found
        "409":
          description: Partnership not accepted, or a proposal is already pending

  /coop/partnerships/{id}/renegotiation/respond:
    post:
      operationId: respondToCoopRenegotiation
      tags: [coop]
      summary: Merchant-facing — the other participant accepts or declines a pending re-negotiation proposal; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteRespond"
      responses:
        "200":
          description: Partnership with the proposal applied (accept) or cleared (decline)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header or invalid body
        "403":
          description: Only the non-proposing participant can respond
        "404":
          description: Not found
        "409":
          description: No proposal is pending

  /coop/partnerships/{id}/pause:
    post:
      operationId: pauseCoopPartnership
      tags: [coop]
      summary: Merchant-facing — pause a partnership from the tenant's side; the perk stops appearing everywhere; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paused partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found

  /coop/partnerships/{id}/resume:
    post:
      operationId: resumeCoopPartnership
      tags: [coop]
      summary: Merchant-facing — resume a paused (accepted) partnership; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resumed partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found
        "409":
          description: Only accepted partnerships can be resumed

  /coop/directory:
    get:
      operationId: listCoopDirectory
      tags: [coop]
      summary: Merchant-facing — other active businesses on the platform (name, category, city only); tenant scope via x-tenant-id
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Directory entries, excluding the requesting business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopDirectoryEntry"
        "400":
          description: Missing x-tenant-id header

  /coop/suggestions:
    get:
      operationId: listCoopSuggestions
      tags: [coop]
      summary: Merchant-facing — ranked Suggested Partners feed (complementary fit, proximity, activity), with auto-generated proposal drafts; tenant scope via x-tenant-id
      responses:
        "200":
          description: Ranked partner suggestions with match reasons and a pre-formatted proposal draft
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopSuggestion"
        "400":
          description: Missing x-tenant-id header

  /coop/suggestions/{tenantId}/dismiss:
    post:
      operationId: dismissCoopSuggestion
      tags: [coop]
      summary: Merchant-facing — dismiss a suggested partner (stays hidden from the feed permanently); tenant scope via x-tenant-id
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggestion dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopSuggestionDismissResult"
        "400":
          description: Missing x-tenant-id header
        "404":
          description: Business not found

  /coop/invites:
    post:
      operationId: createCoopInvite
      tags: [coop]
      summary: Merchant-facing — send a partnership invite (strict same-industry guardrail, no override); tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteCreate"
      responses:
        "201":
          description: Pending invite created (perk not live until accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or missing x-tenant-id header
        "403":
          description: Pairing restricted — same-industry guardrail (code SAME_INDUSTRY_RESTRICTED) or plaza exclusivity (code PLAZA_EXCLUSIVITY_RESTRICTED)
        "404":
          description: Business not found

  /coop/plaza-notifications:
    get:
      operationId: listCoopPlazaNotifications
      tags: [coop]
      summary: Merchant-facing — in-app plaza exclusivity notifications for the scoped tenant (as requester or blocked target); tenant scope via x-tenant-id
      responses:
        "200":
          description: Plaza exclusivity notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPlazaNotification"
        "400":
          description: Missing x-tenant-id header

  /coop/plaza-conflicts:
    get:
      operationId: listCoopPlazaConflicts
      tags: [admin]
      summary: Admin-only — list plaza exclusivity conflicts recorded when invites were blocked
      responses:
        "200":
          description: Plaza conflicts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPlazaConflict"

  /coop/plaza-conflicts/{id}/release:
    post:
      operationId: releaseCoopPlazaConflict
      tags: [admin]
      summary: Admin-only — release a plaza exclusivity conflict so the blocked pairing can be retried
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Released conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPlazaConflict"
        "404":
          description: Not found
        "409":
          description: Conflict already released

  /coop/invites/{id}/respond:
    post:
      operationId: respondToCoopInvite
      tags: [coop]
      summary: Merchant-facing — the invited business accepts or declines a pending invite; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteRespond"
      responses:
        "200":
          description: Updated partnership (accepted invites go live immediately)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "403":
          description: Only the invited business can respond
        "404":
          description: Not found
        "409":
          description: Invite already responded to

  /coop/perks:
    get:
      operationId: listCoopActivePerks
      tags: [coop]
      summary: Merchant-facing — live partner perks for the scoped tenant (accepted + active partnerships only); tenant scope via x-tenant-id
      responses:
        "200":
          description: Live partner perks shown on checkout, receipts, and customer pass surfaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopActivePerksResponse"
        "400":
          description: Missing x-tenant-id header

  /coop/redemptions:
    post:
      operationId: redeemCoopPerk
      tags: [coop]
      summary: Merchant-facing — redeem a scanned perk pass, locking that pass instance against double redemption; tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPerkRedeemRequest"
      responses:
        "200":
          description: Redemption result — valid is false for unknown/inactive/out-of-window codes and already-redeemed pass instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPerkRedeemResult"
        "400":
          description: Missing x-tenant-id header or invalid body

  /coop/analytics/partners:
    get:
      operationId: listCoopPartnerPerformance
      tags: [coop]
      summary: Merchant-facing — per-partner co-op performance breakdown (impressions, claims, clients sent/received, revenue influenced); tenant scope via x-tenant-id
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Performance rows, one per accepted partnership (zeros when no events recorded)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPartnerPerformance"
        "400":
          description: Missing x-tenant-id header or invalid date range

  /coop/reports/monthly:
    get:
      operationId: listCoopMonthlyReports
      tags: [coop]
      summary: Merchant-facing — generated monthly co-op impact reports, newest first; tenant scope via x-tenant-id
      responses:
        "200":
          description: Monthly impact reports (empty when none generated yet)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopMonthlyReport"
        "400":
          description: Missing x-tenant-id header

  /coop/platform-invites:
    get:
      operationId: listPlatformInvites
      tags: [coop]
      summary: Merchant-facing — invites this business sent to off-platform businesses, with tracking status; tenant scope via x-tenant-id
      responses:
        "200":
          description: Platform invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformInvite"
        "400":
          description: Missing x-tenant-id header
    post:
      operationId: createPlatformInvite
      tags: [coop]
      summary: Merchant-facing — invite an off-platform business to join and partner; returns a trackable link and a ready-to-send message; tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInviteCreate"
      responses:
        "201":
          description: Created invite with trackable link and copyable message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvite"
        "400":
          description: Missing x-tenant-id header or invalid body

  /coop/campaigns/templates:
    get:
      operationId: listCoopCampaignTemplates
      tags: [coop]
      summary: Merchant-facing — preset flash-campaign templates with suggested windows and boost copy
      responses:
        "200":
          description: Preset templates (plus the custom option)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopCampaignTemplate"

  /coop/campaigns:
    get:
      operationId: listCoopCampaigns
      tags: [coop]
      summary: Merchant-facing — campaigns the scoped tenant participates in (invited, joined, or created), newest first; tenant scope via x-tenant-id
      responses:
        "200":
