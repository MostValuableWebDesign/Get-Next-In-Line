          type: string
          enum: [monthly, biweekly]
        provisionedAt:
          type: string

    CheckoutInput:
      type: object
      required: [tenantId, moduleIds]
      properties:
        tenantId:
          type: integer
        moduleIds:
          type: array
          items:
            type: integer
        applyMarkup:
          type: boolean
        # Optional per-module billing cadence overrides. Modules not listed
        # default to monthly. Only valid for modules that offer a bi-weekly rate.
        moduleCadences:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCadenceSelection"

    ModuleCadenceSelection:
      type: object
      required: [moduleId, cadence]
      properties:
        moduleId:
          type: integer
        cadence:
          type: string
          enum: [monthly, biweekly]

    CheckoutResult:
      type: object
      required: [success, transactionId, totalWholesale, totalResale, margin, modulesProvisioned, message]
      properties:
        success:
          type: boolean
        transactionId:
          type: string
        totalWholesale:
          type: number
        totalResale:
          type: number
        margin:
          type: number
        modulesProvisioned:
          type: integer
        modulesSkipped:
          type: integer
        message:
          type: string
        # How payment was (or will be) collected for this checkout:
        # - simulated: Stripe not configured — modules provisioned with no real charge
        # - live_pending: real Stripe Checkout created — modules provision only
        #   after the payment webhook confirms the charge
        paymentMode:
          type: string
          enum: [simulated, live_pending]
        # Stripe-hosted payment page URL. Present only when paymentMode is live_pending.
        checkoutUrl:
          type: ["string", "null"]

    EmergencyBroadcast:
      type: object
      required:
        [
          id,
          senderTenantId,
          senderName,
          scope,
          severity,
          alertType,
          headline,
          message,
          status,
          resolvedAt,
          targetCount,
          checkedInCount,
          smsSentCount,
          myCheckinStatus,
          myCheckinNote,
          roster,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        senderTenantId:
          type: ["integer", "null"]
          description: NULL when a platform admin sent the broadcast.
        senderName:
          type: string
          description: Sender business name, or "Platform Administration" for admin broadcasts.
        scope:
          type: string
          enum: [network, platform, selected]
        severity:
          type: string
          enum: [info, warning, critical]
        alertType:
          type: string
          enum: [weather_closure, power_outage, safety_alert, schedule_change, other]
        headline:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [active, resolved]
        resolvedAt:
          type: ["string", "null"]
        targetCount:
          type: integer
        checkedInCount:
          type: integer
        smsSentCount:
          type: integer
          description: Subscriber SMS alerts recorded so far across all targets (sent or simulated).
        myCheckinStatus:
          type: ["string", "null"]
          description: The requesting tenant's own check-in status, when scoped and targeted.
        myCheckinNote:
          type: ["string", "null"]
        roster:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyRosterEntry"
        createdAt:
          type: string
        updatedAt:
          type: string

    EmergencyRosterEntry:
      type: object
