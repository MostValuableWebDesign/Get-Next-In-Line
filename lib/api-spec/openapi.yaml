          type: object
          required: [captured, released, failed, capturedFees]
          properties:
            captured:
              type: integer
            released:
              type: integer
            failed:
              type: integer
            capturedFees:
              type: number
        tenantContributions:
          type: array
          description: Per-tenant revenue contribution over the period, largest first. tenantId null = legacy pre-tenant activity.
          items:
            type: object
            required: [tenantId, brandName, entryCount, amount, platformMargin]
            properties:
              tenantId:
