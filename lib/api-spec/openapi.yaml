openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Get Next In Line — GHL + GNIL OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agency
    description: Agency command center
  - name: tenants
    description: Tenant provisioning and management
  - name: modules
    description: Service modules and pricing
  - name: billing
    description: Billing and checkout simulation
  - name: admin
    description: Admin-only operations (never exposed to tenants)
  - name: sos
    description: SOS operations platform — resources, visits, waitlist, appointments, AI receptionist

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agency/dashboard:
    get:
      operationId: getAgencyDashboard
      tags: [agency]
      summary: Get agency dashboard summary — MRR, tenant counts, revenue totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyDashboard"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [agency]
      summary: Get global agency settings including markup percentage
      responses:
        "200":
          description: Agency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
    patch:
      operationId: updateAgencySettings
      tags: [agency]
      summary: Update global agency settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all provisioned tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/activity:
    get:
      operationId: getTenantActivity
      tags: [tenants]
      summary: Recent tenant provisioning and status change activity feed
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Filter activity to a single tenant
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_timestamp
          in: query
          required: false
          description: Keyset cursor — return items strictly older than this (timestamp, id) pair. Must be paired with before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Keyset cursor id tiebreaker; must be paired with before_timestamp.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantActivityPage"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a single tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Remove a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tenants/{id}/modules:
    get:
      operationId: getTenantModules
      tags: [tenants]
      summary: List modules a tenant is subscribed to
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules the tenant is subscribed to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSubscribedModule"
        "404":
          description: Tenant not found

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all service modules with wholesale and resale pricing
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/pricing:
    get:
      operationId: getModulesPricing
      tags: [modules]
      summary: Get all module pricing with current markup applied
      responses:
        "200":
          description: Pricing with markup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModulePricing"

  /modules/tenant-counts:
    get:
      operationId: getModuleTenantCounts
      tags: [modules]
      summary: Get count of active tenants subscribed to each module
      responses:
        "200":
          description: Per-module active tenant counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantCount"

  /modules/{id}/tenants:
    get:
      operationId: getModuleTenants
      tags: [modules]
      summary: List tenants subscribed to a module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenants subscribed to the module
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantSubscriber"
        "404":
          description: Module not found

  /admin/connector-registry:
    get:
      operationId: getConnectorRegistry
      tags: [admin]
      summary: Admin-only — full module list including hidden upstream connector mapping
      responses:
        "200":
          description: Modules with hidden connector details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorRegistryEntry"

  /admin/connector-registry/{id}:
    patch:
      operationId: updateConnectorRegistryEntry
      tags: [admin]
      summary: Admin-only — update a module's hidden connector details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRegistryEntryUpdate"
      responses:
        "200":
          description: Updated registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRegistryEntry"
        "404":
          description: Not found

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [billing]
      summary: Get billing summary — total MRR breakdown by category
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /billing/checkout:
    post:
      operationId: simulateCheckout
      tags: [billing]
      summary: Simulate Stripe checkout for module provisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "409":
          description: All selected modules are already provisioned for this tenant

  /sos/dashboard:
    get:
      operationId: getSosDashboard
      tags: [sos]
      summary: SOS operations dashboard — live counts, wait times, resource utilization
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosDashboard"

  /sos/settings:
    get:
      operationId: getSosSettings
      tags: [sos]
      summary: Get SOS business settings (business name, resource label, industry type)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosSettings"
    patch:
      operationId: updateSosSettings
      tags: [sos]
      summary: Update SOS business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosSettings"

  /sos/resources:
    get:
      operationId: listSosResources
      tags: [sos]
      summary: List all configurable resources (chairs, rooms, tables, bays, etc.)
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosResource"
    post:
      operationId: createSosResource
      tags: [sos]
      summary: Add a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosResource"

  /sos/resources/{id}:
    patch:
      operationId: updateSosResource
      tags: [sos]
      summary: Update a resource (name, type, status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosResourceUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosResource"
        "404":
          description: Not found
    delete:
      operationId: deleteSosResource
      tags: [sos]
      summary: Remove a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sos/customers:
    get:
      operationId: listSosCustomers
      tags: [sos]
      summary: List customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosCustomer"
    post:
      operationId: createSosCustomer
      tags: [sos]
      summary: Add a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosCustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosCustomer"

  /sos/customers/{id}:
    patch:
      operationId: updateSosCustomer
      tags: [sos]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosCustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosCustomer"
        "404":
          description: Not found

  /sos/visits:
    get:
      operationId: listSosVisits
      tags: [sos]
      summary: List visits (live queue + in service), newest first
      parameters:
        - name: active
          in: query
          required: false
          description: When true, only visits not yet checked out
          schema:
            type: boolean
      responses:
        "200":
          description: Visits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosVisit"
    post:
      operationId: checkInSosVisit
      tags: [sos]
      summary: Check a customer in — starts the journey state machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosVisitInput"
      responses:
        "201":
          description: Created visit in checked_in state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosVisit"

  /sos/visits/{id}/advance:
    post:
      operationId: advanceSosVisit
      tags: [sos]
      summary: Advance a visit through the journey state machine (optionally assigning a resource)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosVisitAdvance"
      responses:
        "200":
          description: Updated visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosVisit"
        "404":
          description: Not found
        "409":
          description: Illegal state transition

  /sos/appointments:
    get:
      operationId: listSosAppointments
      tags: [sos]
      summary: List appointments for the calendar
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosAppointment"
    post:
      operationId: createSosAppointment
      tags: [sos]
      summary: Book an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosAppointmentInput"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosAppointment"

  /sos/appointments/{id}/cancel:
    post:
      operationId: cancelSosAppointment
      tags: [sos]
      summary: Cancel an appointment — triggers the smart waitlist fill engine (SMS broadcast to waitlisted clients)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancellation result including how many waitlisted clients were notified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosCancellationResult"
        "404":
          description: Not found

  /sos/waitlist:
    get:
      operationId: listSosWaitlist
      tags: [sos]
      summary: List waitlist entries
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosWaitlistEntry"
    post:
      operationId: createSosWaitlistEntry
      tags: [sos]
      summary: Add a customer to the waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosWaitlistEntryInput"
      responses:
        "201":
          description: Created waitlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosWaitlistEntry"

  /sos/waitlist/{id}/claim:
    post:
      operationId: claimSosWaitlistSlot
      tags: [sos]
      summary: Waitlisted client claims an open slot (self-booking) — books the appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booked appointment from the claimed slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosAppointment"
        "404":
          description: Not found
        "409":
          description: Slot no longer available

  /sos/messages:
    get:
      operationId: listSosMessages
      tags: [sos]
      summary: SMS message log (broadcasts, you're-next alerts, AI follow-ups)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Messages, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosMessage"
    post:
      operationId: sendSosMessage
      tags: [sos]
      summary: Send an SMS to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosMessageInput"
      responses:
        "201":
          description: Sent message record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosMessage"

  /sos/calls:
    get:
      operationId: listSosCalls
      tags: [sos]
      summary: AI receptionist call log
      responses:
        "200":
          description: Calls, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosCall"
    post:
      operationId: simulateSosCall
      tags: [sos]
      summary: Simulate an inbound call handled by the AI receptionist (books/follows up automatically)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosCallInput"
      responses:
        "201":
          description: Handled call with outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosCall"

  /sos/reports/summary:
    get:
      operationId: getSosReportsSummary
      tags: [sos]
      summary: Reports — visits by day, avg wait time, fill-engine performance, call outcomes
      responses:
        "200":
          description: Report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosReportsSummary"

components:
  schemas:
    SosSettings:
      type: object
      required: [id, businessName, industryType, resourceLabel, aiReceptionistEnabled, waitlistAutoFillEnabled, updatedAt]
      properties:
        id:
          type: integer
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: ["string", "null"]
        smsMode:
          type: string
          enum: [live, simulated]
        smsActiveFromNumber:
          type: ["string", "null"]
        updatedAt:
          type: string

    SosSettingsUpdate:
      type: object
      properties:
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: string

    SosResource:
      type: object
      required: [id, name, resourceType, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [available, occupied, cleaning, offline]
        currentVisitId:
          type: ["integer", "null"]
        currentCustomerName:
          type: ["string", "null"]
        createdAt:
          type: string

    SosResourceInput:
      type: object
      required: [name, resourceType]
      properties:
        name:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1

    SosResourceUpdate:
      type: object
      properties:
        name:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [available, occupied, cleaning, offline]

    SosCustomer:
      type: object
      required: [id, name, smsOptIn, visitCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        smsOptIn:
          type: boolean
        visitCount:
          type: integer
        lastVisitAt:
          type: ["string", "null"]
        createdAt:
          type: string

    SosCustomerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
        smsOptIn:
          type: boolean

    SosCustomerUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        smsOptIn:
          type: boolean

    SosVisit:
      type: object
      required: [id, customerId, customerName, status, serviceType, partySize, checkedInAt]
      properties:
        id:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        status:
          type: string
          enum: [checked_in, queued, assigned, notified, in_service, payment, checked_out]
        serviceType:
          type: string
        partySize:
          type: integer
        resourceId:
          type: ["integer", "null"]
        resourceName:
          type: ["string", "null"]
        estimatedWaitMinutes:
          type: ["integer", "null"]
        paymentAmount:
          type: ["number", "null"]
        checkedInAt:
          type: string
        serviceStartedAt:
          type: ["string", "null"]
        checkedOutAt:
          type: ["string", "null"]

    SosVisitInput:
      type: object
      required: [customerId, serviceType]
      properties:
        customerId:
          type: integer
        serviceType:
          type: string
          minLength: 1
        partySize:
          type: integer
        estimatedWaitMinutes:
          type: integer

    SosVisitAdvance:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [queue, assign, notify, start_service, request_payment, check_out]
        resourceId:
          type: integer
        paymentAmount:
          type: number

    SosAppointment:
      type: object
      required: [id, customerId, customerName, serviceType, startsAt, endsAt, status, source, createdAt]
      properties:
        id:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        serviceType:
          type: string
        startsAt:
          type: string
        endsAt:
          type: string
        status:
          type: string
          enum: [booked, cancelled, completed, filled]
        source:
          type: string
          enum: [staff, ai_receptionist, waitlist_fill, self_book]
        resourceId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    SosAppointmentInput:
      type: object
      required: [customerId, serviceType, startsAt, endsAt]
      properties:
        customerId:
          type: integer
        serviceType:
          type: string
          minLength: 1
        startsAt:
          type: string
        endsAt:
          type: string
        resourceId:
          type: integer
        notes:
          type: string
        source:
          type: string
          enum: [staff, ai_receptionist, waitlist_fill, self_book]

    SosCancellationResult:
      type: object
      required: [appointment, waitlistNotified, messagesSent]
      properties:
        appointment:
          $ref: "#/components/schemas/SosAppointment"
        waitlistNotified:
          type: integer
        messagesSent:
          type: integer

    SosWaitlistEntry:
      type: object
      required: [id, customerId, customerName, desiredService, status, createdAt]
