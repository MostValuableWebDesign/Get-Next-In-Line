        category:
          type: string
        region:
          type: string
        contactEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isVerified:
          type: boolean
        isActive:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementVendorItem"
        createdAt:
          type: string
          format: date-time

    ProcurementVendorCreate:
      type: object
      required: [name, category, region]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        contactEmail:
          type: string
        notes:
          type: string
        isVerified:
          type: boolean

    ProcurementVendorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        contactEmail:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        isVerified:
          type: boolean
        isActive:
          type: boolean

    ProcurementVendorItemCreate:
      type: object
      required: [name, unit, basePrice]
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        basePrice:
          type: number
          minimum: 0
          maximum: 100000
        bulkTiers:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementBulkTier"

    ProcurementVendorItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        basePrice:
          type: number
          minimum: 0
          maximum: 100000
        bulkTiers:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementBulkTier"
        isActive:
          type: boolean

    ProcurementGroupBuyParticipant:
      type: object
      required: [tenantId, tenantName, quantity, isOrganizer]
      properties:
        tenantId:
          type: integer
        tenantName:
          type: string
        quantity:
          type: integer
        isOrganizer:
          type: boolean

    ProcurementGroupBuy:
      type: object
      required:
        [
          id, status, vendorItemId, itemName, unit, vendorId, vendorName,
          basePrice, bulkTiers, organizerTenantId, organizerTenantName,
          totalQuantity, currentUnitPrice, participants, createdAt,
        ]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [open, closed, cancelled]
        vendorItemId:
          type: integer
        itemName:
          type: string
        unit:
          type: string
        vendorId:
          type: integer
        vendorName:
          type: string
        basePrice:
          type: number
        bulkTiers:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementBulkTier"
        organizerTenantId:
          type: integer
        organizerTenantName:
          type: string
        totalQuantity:
          type: integer
          description: Sum of every participant's quantity — the pooled volume.
        currentTier:
          oneOf:
            - $ref: "#/components/schemas/ProcurementBulkTier"
            - type: "null"
          description: The volume-discount tier the pool has reached (null = base pricing).
        nextTier:
          oneOf:
            - $ref: "#/components/schemas/ProcurementBulkTier"
            - type: "null"
          description: The next tier the pool could unlock (null = top tier reached).
        currentUnitPrice:
          type: number
          description: Live per-unit price at the reached tier (frozen achieved price once closed).
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementGroupBuyParticipant"
        myQuantity:
          type: ["integer", "null"]
          description: The scoped tenant's quantity in this pool (null when not participating).
        achievedTierMinQty:
          type: ["integer", "null"]
        achievedUnitPrice:
          type: ["number", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ProcurementGroupBuyCreate:
      type: object
      required: [vendorItemId, quantity]
      properties:
        vendorItemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 10000

    ProcurementGroupBuyJoin:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 10000
          description: This tenant's pooled quantity; 0 leaves the group buy.

    ProcurementLedgerEntry:
      type: object
      required:
        [
          id, groupBuyId, tenantId, tenantName, itemName, vendorName, quantity,
          unitPrice, baseUnitPrice, shareAmount, savingsAmount, createdAt,
        ]
      properties:
        id:
          type: integer
        groupBuyId:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
        itemName:
          type: string
        vendorName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        baseUnitPrice:
          type: number
        shareAmount:
          type: number
          description: quantity × achieved unit price — this participant's proportional share.
        savingsAmount:
          type: number
          description: quantity × (base − achieved unit price) — savings versus solo pricing.
        createdAt:
          type: string
          format: date-time

    ProcurementLedgerView:
      type: object
      required: [groupBuy, entries, totals]
      properties:
        groupBuy:
          $ref: "#/components/schemas/ProcurementGroupBuy"
        entries:
          type: array
          description: Organizer sees every participant line; participants see their own.
          items:
            $ref: "#/components/schemas/ProcurementLedgerEntry"
        totals:
          type: object
          required: [quantity, amount, savings]
          properties:
            quantity:
              type: integer
            amount:
              type: number
            savings:
              type: number

    ProcurementSupplyItem:
      type: object
      required:
        [
          id, name, unit, onHandQty, lowStockThreshold, autoRequestEnabled,
          autoRestockEnabled, belowThreshold, createdAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        onHandQty:
          type: integer
        lowStockThreshold:
          type: integer
        vendorItemId:
          type: ["integer", "null"]
        vendorItemName:
          type: ["string", "null"]
        vendorName:
          type: ["string", "null"]
        autoRequestEnabled:
          type: boolean
        autoRestockEnabled:
          type: boolean
          description: When true (default), a settling group buy on the linked vendor item adds the settled quantity to on-hand stock automatically.
        belowThreshold:
          type: boolean
          description: True when on-hand quantity is below the low-stock threshold — a reorder reminder is due.
        openGroupBuyId:
          type: ["integer", "null"]
          description: An open group buy on the linked vendor item, when one exists (join target for one-click replenishment).
        lastReorderRemindedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ProcurementSupplyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        onHandQty:
          type: integer
          minimum: 0
          maximum: 1000000
        lowStockThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
        vendorItemId:
          type: integer
        autoRequestEnabled:
          type: boolean
        autoRestockEnabled:
          type: boolean

    ProcurementSupplyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        unit:
          type: string
          minLength: 1
        onHandQty:
          type: integer
          minimum: 0
          maximum: 1000000
        lowStockThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
        vendorItemId:
          type: ["integer", "null"]
        autoRequestEnabled:
          type: boolean
        autoRestockEnabled:
          type: boolean

    ProcurementReplenishRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          description: Quantity to pool; defaults to the shortfall versus the threshold (minimum 1).

    ProcurementReplenishResult:
      type: object
      required: [action, groupBuy]
      properties:
        action:
          type: string
          enum: [created, joined]
        groupBuy:
          $ref: "#/components/schemas/ProcurementGroupBuy"

    ProcurementAdminOverview:
      type: object
      required:
        [
          vendorCount, verifiedVendorCount, openGroupBuys, closedGroupBuyCount,
          totalSavings, savingsByTenant,
        ]
      properties:
        vendorCount:
          type: integer
        verifiedVendorCount:
          type: integer
        openGroupBuys:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementGroupBuy"
        closedGroupBuyCount:
          type: integer
        totalSavings:
          type: number
          description: Cumulative co-op savings across every ledger entry.
        savingsByTenant:
          type: array
          items:
            type: object
            required: [tenantId, tenantName, savings]
            properties:
              tenantId:
                type: integer
              tenantName:
                type: string
              savings:
                type: number
