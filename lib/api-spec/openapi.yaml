      properties:
        visitId:
          type: integer

    TipSplitAllocation:
      type: object
      required: [tenantId, tenantName, staffId, staffName, amount]
      properties:
        tenantId:
          type: ["integer", "null"]
        tenantName:
          type: ["string", "null"]
        staffId:
          type: integer
        staffName:
          type: string
        amount:
          type: number

    TipSplitPreview:
      type: object
      required: [ruleId, splitMethod, allocations]
      properties:
        # null = no applicable rule; the whole tip defaults to the servicing
        # staff member.
        ruleId:
          type: ["integer", "null"]
        splitMethod:
          type: ["string", "null"]
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/TipSplitAllocation"

    GratuityLedgerEntry:
      type: object
      required: [id, visitId, serviceType, sourceTenantId, sourceTenantName, recipientTenantId, recipientStaffId, recipientStaffName, grossTip, allocatedShare, ruleId, origin, createdAt]
      properties:
        id:
          type: integer
        visitId:
          type: integer
        serviceType:
          type: string
        sourceTenantId:
          type: ["integer", "null"]
        sourceTenantName:
          type: ["string", "null"]
        recipientTenantId:
          type: ["integer", "null"]
        recipientStaffId:
          type: integer
        recipientStaffName:
          type: string
        grossTip:
          type: number
        allocatedShare:
          type: number
        ruleId:
          type: ["integer", "null"]
