        origin:
          type: string
          enum: [own, partner]
        createdAt:
          type: string

    GratuityShiftReportRow:
      type: object
      required: [staffId, staffName, ownTips, partnerTips, totalTips, entries]
      properties:
        staffId:
          type: integer
        staffName:
          type: string
        # Gratuities from the staff member's own business's checkouts.
        ownTips:
          type: number
        # Pooled gratuities originating at partner businesses.
        partnerTips:
          type: number
        totalTips:
          type: number
        entries:
          type: integer
    SosPlan:
      type: object
      required: [id, name, planType, description, price, billingInterval, discountPercent, creditCount, isActive, createdAt]
      properties:
