      type: object
      required:
        [id, entryType, amount, fee, partnershipId, partnershipPerkTitle, redemptionId, boostId, status, description, createdAt]
      properties:
        id:
          type: integer
        entryType:
          type: string
          enum: [redemption_earning, redemption_charge, boost_purchase, payout]
        amount:
          type: number
          description: Signed dollars — positive credits the balance, negative debits it. Earnings are net of the platform fee.
        fee:
          type: number
          description: Platform fee already deducted from this entry's gross amount; 0 for non-earning entries.
        partnershipId:
          type: ["integer", "null"]
        partnershipPerkTitle:
          type: ["string", "null"]
        redemptionId:
          type: ["integer", "null"]
        boostId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, paid_out]
        description:
          type: ["string", "null"]
        createdAt:
          type: string

