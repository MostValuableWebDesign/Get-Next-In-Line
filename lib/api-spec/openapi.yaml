    AdminComplianceSummary:
      type: object
      required: [from, to, totals, mrrByCategory, bySource, depositOutcomes, tenantContributions]
      properties:
        from:
          type: string
        to:
          type: string
        totals:
          type: object
          required: [entryCount, grossAmount, platformMargin]
          properties:
            entryCount:
              type: integer
              description: Number of ledger entries in the period.
            grossAmount:
              type: number
              description: Sum of all money moved in the period (subscription charges, visit payments, plan sales, captured deposit fees).
            platformMargin:
              type: number
              description: Platform's realized margin in the period (resale minus wholesale on subscription charges; partner pass-through contributes zero).
        mrrByCategory:
          type: array
          description: Current monthly-equivalent module MRR by category, from realized charged amounts (legacy rows fall back to current markup; partner category is pass-through with zero margin).
          items:
            type: object
            required: [category, mrr, platformMargin]
            properties:
              category:
                type: string
              mrr:
                type: number
              platformMargin:
                type: number
        bySource:
          type: array
          description: Period transaction volume broken down by ledger source.
          items:
            type: object
            required: [source, entryCount, amount]
            properties:
              source:
                type: string
              entryCount:
                type: integer
              amount:
                type: number
