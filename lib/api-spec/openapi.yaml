      tags: [partners]
      summary: Disconnect a partner integration and purge stored credentials
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "404":
          description: Partner not found

components:
  schemas:
    PartnerConnectionSummary:
      type: object
      required: [partnerId, moduleId, moduleName, partnerBrand, isActive, status, lastSyncAt, connectedAt]
      properties:
        partnerId:
          # URL-safe key derived from the customer-facing partner brand
          # (e.g. "deel", "next-insurance"). No internal slugs or connector
          # details are exposed here.
          type: string
        moduleId:
          type: integer
        moduleName:
          type: string
        partnerBrand:
          type: string
        isActive:
          type: boolean
        status:
          type: string
          enum: [not_connected, pending, active, error]
        lastSyncAt:
          type: ["string", "null"]
        connectedAt:
          type: ["string", "null"]

    PartnerConnectResult:
      type: object
      required: [partnerId, status, authorizationUrl, state]
      properties:
        partnerId:
          type: string
        status:
          type: string
          enum: [pending]
        authorizationUrl:
          # Simulated/sandbox authorization URL — real partner OAuth endpoints
          # drop in here once live credentials exist.
          type: string
        state:
          # One-time handshake state token the authorization step must echo back.
          type: string

    PartnerCallbackBody:
      type: object
      required: [state, code]
      properties:
        state:
          type: string
        code:
          type: string

    PartnerConnectionEvent:
      type: object
      required: [id, eventType, details, createdAt]
      properties:
        id:
          type: integer
        eventType:
          type: string
        details:
          type: ["string", "null"]
        createdAt:
          type: string

    PartnerConnectionStatus:
      type: object
      required: [partnerId, moduleId, moduleName, partnerBrand, status, lastSyncAt, connectedAt, lastError, events]
      properties:
        partnerId:
          type: string
        moduleId:
          type: integer
        moduleName:
          type: string
        partnerBrand:
          type: string
        status:
          type: string
          enum: [not_connected, pending, active, error]
        lastSyncAt:
          type: ["string", "null"]
        connectedAt:
          type: ["string", "null"]
        lastError:
          type: ["string", "null"]
        events:
          type: array
          items:
            $ref: "#/components/schemas/PartnerConnectionEvent"

    ConciergeSuggestUpsellsInput:
      type: object
      required: [tenantId, serviceName]
      properties:
        tenantId:
          type: integer
        serviceName:
          type: string
          minLength: 1

    ConciergeUpsellSuggestion:
      type: object
      required: [name]
      properties:
        name:
          type: string
        price:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
        ruleId:
          type: integer

    ConciergeSuggestUpsellsResult:
      type: object
      required: [tenantId, serviceName, suggestions]
      properties:
        tenantId:
          type: integer
        serviceName:
          type: string
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ConciergeUpsellSuggestion"

    ConciergeDispatchMessageInput:
      type: object
      required: [tenantId, clientProfileId, body]
      properties:
        tenantId:
          type: integer
        clientProfileId:
          type: integer
        body:
          type: string
          minLength: 1
        jobType:
          type: string
          enum: [manual, send_reminder, rebooking_nudge]

    ConciergeMessageLog:
      type: object
      required: [id, tenantId, clientProfileId, jobType, channel, status, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        clientProfileId:
          type: ["integer", "null"]
        ruleId:
          type: ["integer", "null"]
        jobType:
          type: string
        channel:
          type: string
        toNumber:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, sent, simulated, failed, skipped]
        errorCode:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        clientName:
          type: ["string", "null"]
        body:
          type: ["string", "null"]
        createdAt:
          type: string

    EngagementRule:
      type: object
      required: [id, tenantId, ruleType, config, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        ruleType:
          type: string
          enum: [reminder, rebooking_nudge, upsell]
        config:
          type: object
          additionalProperties: true
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    EngagementRuleInput:
      type: object
      required: [ruleType]
      properties:
        ruleType:
          type: string
          enum: [reminder, rebooking_nudge, upsell]
        config:
          type: object
          additionalProperties: true
        isActive:
          type: boolean

    EngagementRuleUpdate:
      type: object
      properties:
        config:
          type: object
          additionalProperties: true
        isActive:
          type: boolean

    ConciergeClientProfile:
      type: object
      required: [id, tenantId, name, preferredChannel, smsOptIn, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        preferredChannel:
          type: string
          enum: [sms, email, voice]
        smsOptIn:
          type: boolean
        lastVisitAt:
          type: ["string", "null"]
        nextVisitAt:
          type: ["string", "null"]
        averageCycleDays:
          type: ["integer", "null"]
        createdAt:
          type: string

    ConciergeClientProfileInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        preferredChannel:
          type: string
          enum: [sms, email, voice]
        smsOptIn:
          type: boolean
        lastVisitAt:
          type: ["string", "null"]
        nextVisitAt:
          type: ["string", "null"]
        averageCycleDays:
          type: ["integer", "null"]

    ConciergeClientProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        preferredChannel:
          type: string
          enum: [sms, email, voice]
        smsOptIn:
          type: boolean
        lastVisitAt:
          type: ["string", "null"]
        nextVisitAt:
          type: ["string", "null"]
        averageCycleDays:
          type: ["integer", "null"]

    SosSettings:
      type: object
      required: [id, businessName, industryType, resourceLabel, aiReceptionistEnabled, waitlistAutoFillEnabled, serviceNames, noShowShieldEnabled, noShowShieldProvisioned, noShowDepositAmount, noShowCancellationWindowHours, noShowFee, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        serviceNames:
          type: string
          description: Comma-separated list of the business's own service names.
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: ["string", "null"]
        smsMode:
          type: string
          enum: [live, simulated]
        smsActiveFromNumber:
          type: ["string", "null"]
        smsInboundWebhookUrl:
          type: ["string", "null"]
        smsInboundReady:
          type: boolean
        noShowShieldEnabled:
          type: boolean
        noShowShieldProvisioned:
          type: boolean
          description: Whether the No-Show Shield module is provisioned — the policy only enforces when provisioned AND enabled.
        noShowDepositAmount:
          type: number
        noShowCancellationWindowHours:
          type: integer
        noShowFee:
          type: number
        updatedAt:
          type: string

    SosSettingsUpdate:
      type: object
      properties:
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        serviceNames:
          type: string
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: string
        noShowShieldEnabled:
          type: boolean
        noShowDepositAmount:
          type: number
          minimum: 0
        noShowCancellationWindowHours:
          type: integer
          minimum: 0
        noShowFee:
          type: number
          minimum: 0

    SosResource:
      type: object
      required: [id, name, resourceType, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [available, occupied, cleaning, offline]
        currentVisitId:
          type: ["integer", "null"]
        currentCustomerName:
          type: ["string", "null"]
        createdAt:
          type: string

    SosResourceInput:
      type: object
      required: [name, resourceType]
      properties:
        name:
          type: string
          minLength: 1
        resourceType:
          type: string
          minLength: 1

    SosResourceUpdate:
      type: object
      properties:
        name:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [available, occupied, cleaning, offline]

    SosCustomer:
      type: object
      required: [id, name, smsOptIn, visitCount, createdAt, clientProfileId, marketing]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        smsOptIn:
          type: boolean
        visitCount:
          type: integer
        lastVisitAt:
          type: ["string", "null"]
        createdAt:
          type: string
        clientProfileId:
          type: ["integer", "null"]
        marketing:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SosCustomerMarketing"

    SosCustomerMarketing:
      type: object
