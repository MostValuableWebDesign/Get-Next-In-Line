    CoopPassKey:
      type: object
      required: [keyId, status, publicKeyJwk, createdAt]
      properties:
        keyId:
          type: string
        status:
          type: string
          enum: [active, retired]
        publicKeyJwk:
          type: object
          required: [kty, crv, x, y]
          properties:
            kty:
              type: string
            crv:
              type: string
            x:
              type: string
            y:
              type: string
          description: ECDSA P-256 public key as a JWK, importable with Web Crypto importKey("jwk", …).
        createdAt:
          type: string
          format: date-time

    CoopPassKeysResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/CoopPassKey"

    CoopPassSignatureRequest:
      type: object
      required: [passCode, codes]
      properties:
        passCode:
          type: string
          minLength: 1
          description: The customer pass instance the QR is rendered for (e.g. "C123").
        codes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
          description: Redemption/tracking codes to sign, one per perk shown on the pass surface.

    CoopPassSignatureResponse:
      type: object
      required: [signatures]
      properties:
        signatures:
          type: array
          items:
            type: object
            required: [code, qrPayload]
            properties:
              code:
                type: string
              qrPayload:
                type: string
                description: Compact signed QR string (GNILPASS.<payload>.<signature>).

    CoopOfflineRedemptionItem:
      type: object
      required: [clientRedemptionId, code, passCode, scannedAt]
      properties:
        clientRedemptionId:
          type: string
          minLength: 8
          maxLength: 100
          description: Client-generated unique id for this offline scan — the idempotency key across retried sync batches.
        code:
          type: string
          minLength: 1
        passCode:
          type: string
          minLength: 1
        scannedAt:
          type: string
          format: date-time
          description: When the device accepted the redemption offline.

    CoopOfflineSyncRequest:
      type: object
      required: [redemptions]
      properties:
        redemptions:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/CoopOfflineRedemptionItem"

    CoopOfflineSyncResult:
      type: object
      required: [clientRedemptionId, outcome, reason, redeemedAt, perkTitle, winningRedeemedAt]
      properties:
        clientRedemptionId:
          type: string
        outcome:
          type: string
          enum: [accepted, duplicate, conflict, rejected]
          description: accepted = applied now; duplicate = this exact item already applied (retry); conflict = pass already redeemed elsewhere, entry recorded for audit; rejected = failed validation, recorded for audit.
        reason:
          type: ["string", "null"]
        redeemedAt:
          type: ["string", "null"]
          format: date-time
        perkTitle:
          type: ["string", "null"]
        winningRedeemedAt:
          type: ["string", "null"]
          format: date-time
          description: For conflicts — when the winning redemption happened.

    CoopOfflineSyncResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CoopOfflineSyncResult"

    CoopPerkRedeemResult:
      type: object
      required: [valid, reason, partnership, redeemedAt]
      properties:
        valid:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why redemption failed (unknown code, inactive, not started, expired, already redeemed); null when valid.
        partnership:
          oneOf:
            - $ref: "#/components/schemas/CoopPartnership"
            - type: "null"
        redeemedAt:
          type: ["string", "null"]
          description: When this pass instance was redeemed; set on success and on already-redeemed rejections.

    CoopPartnerPerformance:
      type: object
      required:
        [partnershipId, partnerTenantId, partnerName, perkTitle, isActive, impressions, claims, clientsSent, clientsReceived, revenueInfluenced]
      properties:
        partnershipId:
          type: integer
        partnerTenantId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        isActive:
          type: boolean
        impressions:
          type: integer
          description: Perk blocks shown to this business's customers (checkout, receipts, passes, public landing).
        claims:
          type: integer
          description: Redemption codes validated/redeemed at this business.
        clientsSent:
          type: integer
          description: Cross-over visits recorded at the partner (customers this business sent).
        clientsReceived:
          type: integer
          description: Cross-over visits recorded at this business (customers the partner sent).
        revenueInfluenced:
          type: number
          description: Estimated checkout revenue attributed to cross-over visits at this business.

    CoopMonthlyReport:
      type: object
      required: [id, month, impressions, claims, crossoverVisits, revenueInfluenced, createdAt]
      properties:
        id:
          type: integer
        month:
          type: string
          description: Calendar month key, e.g. "2026-06".
        impressions:
          type: integer
        claims:
          type: integer
        crossoverVisits:
          type: integer
        revenueInfluenced:
          type: number
        createdAt:
          type: string

    CoopPartnershipSentiment:
      type: object
      required:
        [partnershipId, partnerTenantId, partnerName, perkTitle, responses, avgRating, nps, repeatVisitRate, positive, neutral, negative]
      properties:
        partnershipId:
          type: integer
        partnerTenantId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        responses:
          type: integer
        avgRating:
          type: ["number", "null"]
          description: Average 1-5 satisfaction rating (null when no rated responses).
        nps:
          type: ["integer", "null"]
          description: NPS-style score in [-100, 100] from "would recommend" replies (null when unanswered).
        repeatVisitRate:
          type: ["number", "null"]
          description: Share (0-1) of resolved wallet customers with more than one redemption on this partnership.
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer

    CoopSentimentSummary:
      type: object
      required:
        [totalResponses, networkAvgRating, networkNps, positive, neutral, negative, praiseThemes, frictionThemes, partnerships]
      properties:
        totalResponses:
          type: integer
        networkAvgRating:
          type: ["number", "null"]
        networkNps:
          type: ["integer", "null"]
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
        praiseThemes:
          type: array
          items:
            type: string
          description: Recurring praise themes across the tenant's network, most frequent first.
        frictionThemes:
          type: array
          items:
            type: string
          description: Emerging friction themes (from negative-sentiment feedback), most frequent first.
        partnerships:
          type: array
          items:
            $ref: "#/components/schemas/CoopPartnershipSentiment"

    CoopSentimentRanking:
      type: object
      required:
        [partnershipId, partnerName, perkTitle, responses, avgRating, nps, repeatVisitRate, positive, neutral, negative]
      properties:
        partnershipId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        responses:
          type: integer
        avgRating:
          type: ["number", "null"]
        nps:
          type: ["integer", "null"]
        repeatVisitRate:
          type: ["number", "null"]
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer

    CoopSentimentReport:
      type: object
      required: [id, periodType, periodKey, rankings, summary, createdAt]
      properties:
        id:
          type: integer
        periodType:
          type: string
          enum: [weekly, monthly]
        periodKey:
          type: string
          description: '"2026-W30" for weekly, "2026-06" for monthly.'
        rankings:
          type: array
          items:
            $ref: "#/components/schemas/CoopSentimentRanking"
          description: Partnerships ranked by satisfaction (rating, then NPS, then repeat-visit rate).
        summary:
          type: string
          description: Plain-language recommendations on which pairings drive the strongest retention and sentiment.
        createdAt:
          type: string

    CoopRetailItem:
      type: object
      required:
        [id, partnershipId, hostTenantId, hostTenantName, ownerTenantId, ownerTenantName, name, quantityOnShelf, unitPrice, ownerSharePercent, lowStockThreshold, lowStock, isActive, createdAt]
      properties:
        id:
          type: integer
        partnershipId:
          type: integer
        hostTenantId:
          type: integer
        hostTenantName:
          type: string
        ownerTenantId:
          type: integer
        ownerTenantName:
          type: string
        name:
          type: string
        quantityOnShelf:
          type: integer
        unitPrice:
          type: number
        ownerSharePercent:
          type: integer
          description: Percent of gross revenue owed to the originating partner; the host keeps the rest.
        lowStockThreshold:
          type: integer
        lowStock:
          type: boolean
          description: True when quantityOnShelf is at or below the threshold.
        isActive:
          type: boolean
        createdAt:
          type: string

    CoopRetailItemsResponse:
      type: object
      required: [hosted, placed]
      properties:
        hosted:
          type: array
          description: Items this business physically hosts on its shelves.
          items:
            $ref: "#/components/schemas/CoopRetailItem"
        placed:
          type: array
          description: This business's own items on partners' shelves.
          items:
            $ref: "#/components/schemas/CoopRetailItem"

    CoopRetailItemCreate:
      type: object
      required: [partnershipId, name, quantityOnShelf, unitPrice, ownerSharePercent]
      properties:
        partnershipId:
          type: integer
        name:
          type: string
          minLength: 1
        quantityOnShelf:
          type: integer
          minimum: 0
        unitPrice:
          type: number
          minimum: 0
        ownerSharePercent:
          type: integer
          minimum: 0
          maximum: 100
        lowStockThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 3

    CoopRetailItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        unitPrice:
          type: number
          minimum: 0
        ownerSharePercent:
          type: integer
          minimum: 0
          maximum: 100
        lowStockThreshold:
          type: integer
          minimum: 0
          maximum: 1000000
        isActive:
          type: boolean

    CoopRetailStockAdjustment:
      type: object
      required: [quantityDelta, reason]
      properties:
        quantityDelta:
          type: integer
          description: Signed change; positive for restock, negative for shrinkage/removal. Never zero.
        reason:
          type: string
          enum: [restock, shrinkage, correction]
        note:
          type: string

    CoopRetailSaleRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CoopRetailSaleResult:
      type: object
      required: [item, unitsSold, grossAmount, hostShareAmount, ownerShareAmount, lowStockAlertSent]
      properties:
        item:
          $ref: "#/components/schemas/CoopRetailItem"
        unitsSold:
          type: integer
        grossAmount:
          type: number
        hostShareAmount:
          type: number
        ownerShareAmount:
          type: number
        lowStockAlertSent:
          type: boolean
          description: True when this sale started a low-stock episode and both businesses were alerted.

    CoopRetailPartnerTotals:
      type: object
      required: [partnerTenantId, partnerName, unitsSold, grossRevenue, myShare]
      properties:
        partnerTenantId:
          type: integer
        partnerName:
          type: string
        unitsSold:
          type: integer
        grossRevenue:
          type: number
        myShare:
          type: number

    CoopRetailLedgerEntry:
      type: object
      required: [id, itemId, itemName, partnershipId, counterpartyTenantId, counterpartyName, role, unitsSold, grossAmount, shareAmount, createdAt]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        itemName:
          type: string
        partnershipId:
          type: integer
        counterpartyTenantId:
          type: integer
        counterpartyName:
          type: string
        role:
          type: string
          enum: [host, owner]
        unitsSold:
          type: integer
        grossAmount:
          type: number
        shareAmount:
          type: number
        createdAt:
          type: string

    CoopRetailLedgerResponse:
      type: object
      required: [partners, entries]
      properties:
        partners:
          type: array
          items:
            $ref: "#/components/schemas/CoopRetailPartnerTotals"
        entries:
          type: array
          description: Most recent ledger entries for the scoped tenant (newest first).
          items:
            $ref: "#/components/schemas/CoopRetailLedgerEntry"

    CoopPartnershipStats:
      type: object
      required: [partnershipId, partnerName, perkTitle, isActive, sent, received]
      properties:
        partnershipId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        isActive:
          type: boolean
        sent:
          type: integer
          description: Customers this business sent to the partner (redeemed there) in the window.
        received:
          type: integer
          description: Customers the partner sent here (redeemed at this business) in the window.

    CoopStatsResponse:
      type: object
      required: [windowDays, totals, partnerships]
      properties:
        windowDays:
          type: integer
        totals:
          type: object
          required: [sent, received]
          properties:
            sent:
              type: integer
            received:
              type: integer
        partnerships:
          type: array
          items:
            $ref: "#/components/schemas/CoopPartnershipStats"

    CoopPartnershipCreate:
      type: object
      required: [hostTenantId, partnerTenantId, perkTitle]
      properties:
        hostTenantId:
          type: integer
        partnerTenantId:
          type: integer
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: string
        redemptionCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,30}[A-Za-z0-9]$"
          description: Optional explicit redemption code; auto-generated when omitted.
        perkValueAmount:
          type: ["number", "null"]
          minimum: 0
          description: Estimated monetary value of the perk in dollars (compliance-ledger trigger); null/omitted = no monetary terms.
        overrideIndustryBarrier:
          type: boolean
          description: Explicitly bypass the same-category (competitor) block.
        perkStartsAt:
          type: string
          format: date-time
        perkEndsAt:
          type: string
          format: date-time
        usageLimitKind:
          type: string
          enum: [unlimited, per_customer, total_cap]
          description: Perk usage limit; defaults to unlimited.
        usageCap:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Required when usageLimitKind=total_cap; ignored otherwise.

    CoopPartnershipUpdate:
      type: object
      properties:
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: ["string", "null"]
        redemptionCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,30}[A-Za-z0-9]$"
        isActive:
          type: boolean
        perkValueAmount:
          type: ["number", "null"]
          minimum: 0
          description: Estimated monetary value of the perk in dollars; changes only affect future redemptions' ledger entries.
        perkStartsAt:
          type: ["string", "null"]
          format: date-time
        perkEndsAt:
          type: ["string", "null"]
          format: date-time
        hostReciprocityThreshold:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000
          description: Only the host may set this; null restores the platform default.
        partnerReciprocityThreshold:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000
          description: Only the partner may set this; null restores the platform default.
        revenueShareKind:
          type: ["string", "null"]
          enum: [bounty, percent, null]
        revenueShareValue:
          type: ["number", "null"]
        revenueShareBaseAmount:
          type: ["number", "null"]
        usageLimitKind:
          type: string
          enum: [unlimited, per_customer, total_cap]
        usageCap:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000000
          description: Required when usageLimitKind=total_cap; cleared otherwise.

    PlatformInvite:
      type: object
      required:
        [
          id,
          invitedBusinessName,
          invitedContact,
          status,
          inviteUrl,
          message,
          resultingTenantId,
          expiresAt,
          createdAt,
        ]
      properties:
        id:
          type: integer
        invitedBusinessName:
          type: string
        invitedContact:
          type: ["string", "null"]
        status:
          type: string
          enum: [sent, clicked, registered, expired]
        inviteUrl:
          type: string
          description: Absolute trackable link the merchant shares with the invited business.
        message:
          type: string
          description: Ready-to-copy SMS/email message including the incentive copy and the link.
        resultingTenantId:
          type: ["integer", "null"]
          description: Tenant created through this invite, once registered.
        expiresAt:
          type: string
        createdAt:
          type: string

    PlatformInviteCreate:
      type: object
      required: [businessName]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          maxLength: 200
          description: Optional phone/email note for the merchant's own tracking.

    PublicPlatformInvite:
      type: object
      required: [inviterBusinessName, invitedBusinessName, status]
      properties:
        inviterBusinessName:
          type: string
        invitedBusinessName:
          type: string
        status:
          type: string
          enum: [sent, clicked, registered, expired]
          description: Registration is only possible while sent/clicked.

    PlatformInviteRegistration:
      type: object
      required: [businessName, subdomain]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 120
        contactName:
          type: string
          maxLength: 120
        contactEmail:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 120
          description: Business category, e.g. HairSalon or CafeOrCoffeeShop.
        subdomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,60}[a-z0-9]$"

    PlatformInviteRegistrationResult:
      type: object
      required: [tenantId, subdomain, brandName, partnershipCreated, partnershipBlockedReason]
      properties:
        tenantId:
          type: integer
        subdomain:
          type: string
        brandName:
          type: string
        partnershipCreated:
          type: boolean
          description: False when the same-industry guardrail blocked the auto-created partnership.
        partnershipBlockedReason:
          type: ["string", "null"]

    CoopIndustryBarrierError:
      type: object
      required: [message, sharedCategories]
      properties:
        message:
          type: string
        sharedCategories:
          type: array
          items:
            type: string

    CoopRedemptionValidation:
      type: object
      required: [valid, reason, partnership]
      properties:
        valid:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why validation failed (unknown code, inactive partnership); null when valid.
        partnership:
          oneOf:
            - $ref: "#/components/schemas/CoopPartnership"
            - type: "null"

    AdminComplianceSummary:
      type: object
      required: [from, to, totals, mrrByCategory, bySource, depositOutcomes, tenantContributions]
      properties:
        from:
          type: string
        to:
          type: string
        totals:
          type: object
          required: [entryCount, grossAmount, platformMargin]
          properties:
            entryCount:
              type: integer
              description: Number of ledger entries in the period.
            grossAmount:
              type: number
              description: Sum of all money moved in the period (subscription charges, visit payments, plan sales, captured deposit fees).
            platformMargin:
              type: number
              description: Platform's realized margin in the period (resale minus wholesale on subscription charges; partner pass-through contributes zero).
        mrrByCategory:
          type: array
          description: Current monthly-equivalent module MRR by category, from realized charged amounts (legacy rows fall back to current markup; partner category is pass-through with zero margin).
          items:
            type: object
            required: [category, mrr, platformMargin]
            properties:
              category:
                type: string
              mrr:
                type: number
              platformMargin:
                type: number
        bySource:
          type: array
          description: Period transaction volume broken down by ledger source.
          items:
            type: object
            required: [source, entryCount, amount]
            properties:
              source:
                type: string
              entryCount:
                type: integer
              amount:
                type: number
        depositOutcomes:
          type: object
          required: [captured, released, failed, capturedFees]
          properties:
            captured:
              type: integer
            released:
              type: integer
            failed:
              type: integer
            capturedFees:
              type: number
        tenantContributions:
          type: array
          description: Per-tenant revenue contribution over the period, largest first. tenantId null = legacy pre-tenant activity.
          items:
            type: object
            required: [tenantId, brandName, entryCount, amount, platformMargin]
            properties:
              tenantId:
                type: integer
                nullable: true
              brandName:
                type: string
              entryCount:
                type: integer
              amount:
                type: number
              platformMargin:
                type: number

    AdminCampaign:
      type: object
      required: [id, code, tenantId, tenantName, name, isActive, clickCount, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        tenantId:
          type: integer
        tenantName:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        clickCount:
          type: integer
        createdAt:
          type: string

    AdminCampaignCreate:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          type: integer
        name:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$"
          description: Optional explicit code; generated from the name when omitted.

    AdminCampaignUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    PublicBookingService:
      type: object
      required: [id, name, category, description, price, durationMinutes]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        durationMinutes:
          type: ["integer", "null"]

    PublicBookingStaff:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    PublicBookingConfig:
      type: object
      required: [slug, brandName, businessName, industryType, resourceLabel, openTime, closeTime, services, staff]
      properties:
        slug:
          type: string
        brandName:
          type: string
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
          description: What this business calls a bookable staff member/resource (e.g. "Chair", "Stylist").
        openTime:
          type: string
        closeTime:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingService"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingStaff"
        capacityStatus:
          type: ["string", "null"]
          enum: [available, moderate, busy, null]
          description: Live capacity status (busy / moderate / available); null when unavailable.

    PublicAvailabilityInput:
      type: object
      required: [serviceId, date]
      properties:
        serviceId:
          type: integer
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Local calendar date (yyyy-mm-dd) to compute slots for.
        resourceId:
          type: integer
          description: Optional preferred staff member/resource.

    PublicTimeSlot:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
        endsAt:
          type: string

    PublicAvailabilityResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/PublicTimeSlot"

    PublicBookingInput:
      type: object
      required: [serviceId, startsAt, name]
      properties:
        serviceId:
          type: integer
        startsAt:
          type: string
        resourceId:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '\S'
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 254
        smsOptIn:
          type: boolean
          description: Explicit consent to receive transactional SMS messages from Get Next In Line and the business being visited.

    PublicBookingConfirmation:
      type: object
      required: [appointmentId, serviceType, startsAt, endsAt, businessName]
      properties:
        appointmentId:
          type: integer
        serviceType:
          type: string
