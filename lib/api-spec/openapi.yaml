openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Get Next In Line — GHL + GNIL OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agency
    description: Agency command center
  - name: tenants
    description: Tenant provisioning and management
  - name: modules
    description: Service modules and pricing
  - name: billing
    description: Billing and checkout simulation
  - name: admin
    description: Admin-only operations (never exposed to tenants)
  - name: partners
    description: Partner-Direct Integrations — connection handshakes and status (webhook listener is server-to-server only, outside this spec)
  - name: sos
    description: SOS operations platform — resources, visits, waitlist, appointments, AI receptionist
  - name: public-booking
    description: Public (no-login) direct-booking flow — service menu, availability, and booking keyed by tenant slug

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agency/dashboard:
    get:
      operationId: getAgencyDashboard
      tags: [agency]
      summary: Get agency dashboard summary — MRR, tenant counts, revenue totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyDashboard"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [agency]
      summary: Get global agency settings including markup percentage
      responses:
        "200":
          description: Agency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
    patch:
      operationId: updateAgencySettings
      tags: [agency]
      summary: Update global agency settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all provisioned tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/activity:
    get:
      operationId: getTenantActivity
      tags: [tenants]
      summary: Recent tenant provisioning and status change activity feed
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Filter activity to a single tenant
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_timestamp
          in: query
          required: false
          description: Keyset cursor — return items strictly older than this (timestamp, id) pair. Must be paired with before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Keyset cursor id tiebreaker; must be paired with before_timestamp.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantActivityPage"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a single tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Remove a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tenants/{id}/modules:
    get:
      operationId: getTenantModules
      tags: [tenants]
      summary: List modules a tenant is subscribed to
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules the tenant is subscribed to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSubscribedModule"
        "404":
          description: Tenant not found

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all service modules with wholesale and resale pricing
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/pricing:
    get:
      operationId: getModulesPricing
      tags: [modules]
      summary: Get all module pricing with current markup applied
      responses:
        "200":
          description: Pricing with markup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModulePricing"

  /modules/tenant-counts:
    get:
      operationId: getModuleTenantCounts
      tags: [modules]
      summary: Get count of active tenants subscribed to each module
      responses:
        "200":
          description: Per-module active tenant counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantCount"

  /modules/{id}/tenants:
    get:
      operationId: getModuleTenants
      tags: [modules]
      summary: List tenants subscribed to a module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenants subscribed to the module
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantSubscriber"
        "404":
          description: Module not found

  /admin/connector-registry:
    get:
      operationId: getConnectorRegistry
      tags: [admin]
      summary: Admin-only — full module list including hidden upstream connector mapping
      responses:
        "200":
          description: Modules with hidden connector details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorRegistryEntry"

  /admin/connector-registry/{id}:
    patch:
      operationId: updateConnectorRegistryEntry
      tags: [admin]
      summary: Admin-only — update a module's hidden connector details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRegistryEntryUpdate"
      responses:
        "200":
          description: Updated registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRegistryEntry"
        "404":
          description: Not found

  /admin/modules/{id}:
    get:
      operationId: getAdminModuleDetail
      tags: [admin]
      summary: Admin-only — module connector mapping, tenant assignments, and provisioning activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connector-aware module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModuleDetail"
        "404":
          description: Module not found

  /coop/partnerships:
    get:
      operationId: listCoopPartnerships
      tags: [admin]
      summary: List merchant co-op partnerships, optionally filtered to one tenant (as host or partner)
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Partnerships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPartnership"
    post:
      operationId: createCoopPartnership
      tags: [admin]
      summary: Create a merchant co-op partnership between two tenants (industry barrier enforced unless overridden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipCreate"
      responses:
        "201":
          description: Created partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Host or partner tenant not found
        "409":
          description: Industry barrier — both tenants share a module category and no override was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopIndustryBarrierError"

  /coop/partnerships/{id}:
    patch:
      operationId: updateCoopPartnership
      tags: [admin]
      summary: Edit a partnership's perk or activate/deactivate it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipUpdate"
      responses:
        "200":
          description: Updated partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Not found

  /coop/taxonomy:
    get:
      operationId: getCoopTaxonomy
      tags: [coop]
      summary: Curated two-level co-op taxonomy (Industry → Sub-Category)
      responses:
        "200":
          description: Taxonomy industries with their sub-categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopTaxonomyIndustry"

  /coop/directory:
    get:
      operationId: listCoopDirectory
      tags: [coop]
      summary: Merchant-facing — other active businesses on the platform (name, category, city only); tenant scope via x-tenant-id
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Directory entries, excluding the requesting business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopDirectoryEntry"
        "400":
          description: Missing x-tenant-id header

  /coop/invites:
    post:
      operationId: createCoopInvite
      tags: [coop]
      summary: Merchant-facing — send a partnership invite (strict same-industry guardrail, no override); tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteCreate"
      responses:
        "201":
          description: Pending invite created (perk not live until accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or missing x-tenant-id header
        "403":
          description: Same-industry pairing restricted by platform guidelines
        "404":
          description: Business not found

  /coop/invites/{id}/respond:
    post:
      operationId: respondToCoopInvite
      tags: [coop]
      summary: Merchant-facing — the invited business accepts or declines a pending invite; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteRespond"
      responses:
        "200":
          description: Updated partnership (accepted invites go live immediately)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "403":
          description: Only the invited business can respond
        "404":
          description: Not found
        "409":
          description: Invite already responded to

  /coop/perks:
    get:
      operationId: listCoopActivePerks
      tags: [coop]
      summary: Merchant-facing — live partner perks for the scoped tenant (accepted + active partnerships only); tenant scope via x-tenant-id
      responses:
        "200":
          description: Live partner perks shown on checkout, receipts, and customer pass surfaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopActivePerksResponse"
        "400":
          description: Missing x-tenant-id header

  /coop/redemptions:
    post:
      operationId: redeemCoopPerk
      tags: [coop]
      summary: Merchant-facing — redeem a scanned perk pass, locking that pass instance against double redemption; tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPerkRedeemRequest"
      responses:
        "200":
          description: Redemption result — valid is false for unknown/inactive/out-of-window codes and already-redeemed pass instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPerkRedeemResult"
        "400":
          description: Missing x-tenant-id header or invalid body

  /coop/analytics/partners:
    get:
      operationId: listCoopPartnerPerformance
      tags: [coop]
      summary: Merchant-facing — per-partner co-op performance breakdown (impressions, claims, clients sent/received, revenue influenced); tenant scope via x-tenant-id
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Performance rows, one per accepted partnership (zeros when no events recorded)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPartnerPerformance"
        "400":
          description: Missing x-tenant-id header or invalid date range

  /coop/reports/monthly:
    get:
      operationId: listCoopMonthlyReports
      tags: [coop]
      summary: Merchant-facing — generated monthly co-op impact reports, newest first; tenant scope via x-tenant-id
      responses:
        "200":
          description: Monthly impact reports (empty when none generated yet)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopMonthlyReport"
        "400":
          description: Missing x-tenant-id header

  /coop/platform-invites:
    get:
      operationId: listPlatformInvites
      tags: [coop]
      summary: Merchant-facing — invites this business sent to off-platform businesses, with tracking status; tenant scope via x-tenant-id
      responses:
        "200":
          description: Platform invites, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformInvite"
        "400":
          description: Missing x-tenant-id header
    post:
      operationId: createPlatformInvite
      tags: [coop]
      summary: Merchant-facing — invite an off-platform business to join and partner; returns a trackable link and a ready-to-send message; tenant scope via x-tenant-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInviteCreate"
      responses:
        "201":
          description: Created invite with trackable link and copyable message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInvite"
        "400":
          description: Missing x-tenant-id header or invalid body

  /public/coop/invites/{token}:
    get:
      operationId: getPublicPlatformInvite
      tags: [public]
      summary: Public — validate a platform-invite token for the fast-track registration page (marks the invite clicked)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite context for the registration page; status tells the page whether registration is still possible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlatformInvite"
        "404":
          description: Unknown invite token

  /public/coop/invites/{token}/register:
    post:
      operationId: registerViaPlatformInvite
      tags: [public]
      summary: Public — fast-track registration through a platform invite; creates the tenant + storefront and the pending co-op partnership
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformInviteRegistration"
      responses:
        "201":
          description: Account created; a pending partnership from the inviter is waiting unless blocked by the same-industry guardrail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformInviteRegistrationResult"
        "400":
          description: Invalid body or subdomain format
        "404":
          description: Unknown invite token
        "409":
          description: Invite already used / subdomain taken
        "410":
          description: Invite expired
        "429":
          description: Too many registration attempts

  /coop/redemptions/{code}:
    get:
      operationId: validateCoopRedemptionCode
      tags: [admin]
      summary: Validate a co-op perk redemption code at checkout time
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation result — valid is false for unknown codes and inactive partnerships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopRedemptionValidation"

  /admin/campaigns:
    get:
      operationId: listAdminCampaigns
      tags: [admin]
      summary: Admin-only — list campaign redirect links with click counts
      responses:
        "200":
          description: Campaigns with click counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCampaign"
    post:
      operationId: createAdminCampaign
      tags: [admin]
      summary: Admin-only — create a campaign redirect code for a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCampaignCreate"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "400":
          description: Invalid body or duplicate code
        "404":
          description: Tenant not found

  /admin/campaigns/{id}:
    patch:
      operationId: updateAdminCampaign
      tags: [admin]
      summary: Admin-only — activate or deactivate a campaign redirect code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "404":
          description: Not found

  /billing/summary:
    get:
      operationId: getBillingSummary
      tags: [billing]
      summary: Get billing summary — total MRR breakdown by category
      responses:
        "200":
          description: Billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSummary"

  /billing/checkout:
    post:
      operationId: simulateCheckout
      tags: [billing]
      summary: Simulate Stripe checkout for module provisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "409":
          description: All selected modules are already provisioned for this tenant

  /sos/dashboard:
    get:
      operationId: getSosDashboard
      tags: [sos]
      summary: SOS operations dashboard — live counts, wait times, resource utilization
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosDashboard"

  /sos/settings:
    get:
      operationId: getSosSettings
      tags: [sos]
      summary: Get SOS business settings (business name, resource label, industry type)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosSettings"
    patch:
      operationId: updateSosSettings
      tags: [sos]
      summary: Update SOS business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosSettings"

  /sos/resources:
    get:
      operationId: listSosResources
      tags: [sos]
      summary: List all configurable resources (chairs, rooms, tables, bays, etc.)
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosResource"
    post:
      operationId: createSosResource
      tags: [sos]
      summary: Add a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosResource"

  /sos/resources/{id}:
    patch:
      operationId: updateSosResource
      tags: [sos]
      summary: Update a resource (name, type, status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosResourceUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosResource"
        "404":
          description: Not found
    delete:
      operationId: deleteSosResource
      tags: [sos]
      summary: Remove a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sos/customers:
    get:
      operationId: listSosCustomers
      tags: [sos]
      summary: List customers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SosCustomer"
    post:
      operationId: createSosCustomer
      tags: [sos]
      summary: Add a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SosCustomerInput"
      responses:
        "201":
          description: Created customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SosCustomer"

  /sos/customers/{id}:
    get:
      operationId: getSosCustomer
      tags: [sos]
      summary: Get a customer (combined operational + marketing view)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Combined customer record
          content:
            application/json:
              schema:
