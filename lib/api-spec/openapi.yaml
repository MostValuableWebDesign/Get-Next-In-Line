          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseOrgUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseOrg"
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/regions:
    post:
      operationId: createFranchiseRegion
      tags: [franchise]
      summary: Create a region (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRegionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRegion"
        "403":
          description: Requires Super Admin
        "409":
          description: Region name already exists in this org

  /franchise/orgs/{orgId}/storefronts:
    post:
      operationId: attachFranchiseStorefront
      tags: [franchise]
      summary: Attach an existing tenant as a storefront (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseStorefrontAttach"
      responses:
        "201":
          description: Attached (active templates deploy automatically)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseStorefront"
        "403":
          description: Requires Super Admin
        "409":
          description: Tenant already belongs to an organization

  /franchise/orgs/{orgId}/storefronts/{tenantId}:
    patch:
      operationId: updateFranchiseStorefront
      tags: [franchise]
      summary: Move a storefront between regions (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseStorefrontUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseStorefront"
        "403":
          description: Requires Super Admin
        "404":
          description: Not found
    delete:
      operationId: detachFranchiseStorefront
      tags: [franchise]
      summary: Detach a storefront (its template-derived perks are retired)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Detached
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/roles:
    get:
      operationId: listFranchiseRoles
      tags: [franchise]
      summary: List role assignments (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseRoleEntry"
        "403":
          description: Requires Super Admin
    post:
      operationId: assignFranchiseRole
      tags: [franchise]
      summary: Assign an org role to a user (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRoleAssign"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRoleEntry"
        "403":
          description: Requires Super Admin
        "409":
          description: User already has a role in this org

  /franchise/orgs/{orgId}/roles/{roleId}:
    delete:
      operationId: removeFranchiseRole
      tags: [franchise]
      summary: Remove a role assignment (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/templates:
    get:
      operationId: listFranchiseTemplates
      tags: [franchise]
      summary: Perk templates with per-location deployment status (scoped to the caller's role)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: No role in this org
    post:
      operationId: createFranchiseTemplate
      tags: [franchise]
      summary: Define & deploy a global perk template to every storefront (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseTemplateCreate"
      responses:
        "201":
          description: Created & deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: Requires Super Admin

  /franchise/orgs/{orgId}/templates/{templateId}:
    patch:
      operationId: updateFranchiseTemplate
      tags: [franchise]
      summary: Update or retire/reactivate a template — changes propagate to every deployed location (Super Admin only)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseTemplateUpdate"
      responses:
        "200":
          description: Updated & propagated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseTemplate"
        "403":
          description: Requires Super Admin
        "404":
          description: Not found

  /franchise/orgs/{orgId}/requests:
    get:
      operationId: listFranchiseRequests
      tags: [franchise]
      summary: Local-partnership approval queue, scoped to the caller's role
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FranchisePartnershipRequest"
        "403":
          description: No role in this org
    post:
      operationId: createFranchiseRequest
      tags: [franchise]
      summary: Storefront-initiated local partnership (zip-code proximity enforced; outcome depends on the org autonomy policy)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRequestCreate"
      responses:
        "201":
          description: Created — approved immediately under the allowed policy, queued under approval_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchisePartnershipRequest"
        "400":
          description: Zip-code mismatch or invalid body
        "403":
          description: Autonomy locked, or storefront outside the caller's scope

  /franchise/orgs/{orgId}/requests/{requestId}/decide:
    post:
      operationId: decideFranchiseRequest
      tags: [franchise]
      summary: Approve or reject a queued local-partnership request (Regional Manager of that region or Super Admin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FranchiseRequestDecision"
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchisePartnershipRequest"
        "403":
          description: Outside the caller's scope
        "404":
          description: Not found
        "409":
          description: Already decided

  /franchise/orgs/{orgId}/rollup:
    get:
      operationId: getFranchiseRollup
      tags: [franchise]
      summary: Consolidated cross-promotion / redemption / revenue roll-up, region- and storefront-broken-down, scoped to the caller's role
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roll-up report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseRollup"
        "403":
          description: No role in this org


components:
  schemas:
    PosIntegration:
      type: object
      required:
        [vendor, vendorLabel, status, webhookUrl, signingSecret, signatureHeader, lastEventAt, lastError, connectedAt]
      properties:
        vendor:
          type: string
          enum: [square, clover, boulevard, vagaro, custom]
        vendorLabel:
          type: string
        status:
          type: string
          enum: [not_configured, active, disabled]
        webhookUrl:
          type: string
          nullable: true
          description: Tenant-specific webhook endpoint to paste into the vendor's webhook configuration.
        signingSecret:
          type: string
          nullable: true
          description: Webhook signing secret for the vendor configuration. Only shown to the authenticated owning merchant.
        signatureHeader:
          type: string
          description: HTTP header the vendor sends its signature in.
        lastEventAt:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        connectedAt:
          type: string
          nullable: true

    PosInboundEvent:
      type: object
      required: [id, vendor, externalEventId, eventKind, status, detail, customerId, visitId, createdAt]
      properties:
        id:
          type: integer
        vendor:
          type: string
        externalEventId:
          type: string
        eventKind:
          type: string
          description: Normalized platform event kind (check_in, service_completed, perk_redeemed, unknown).
        status:
          type: string
          description: Processing outcome (processed, ignored, unrecognized, invalid, error, received).
        detail:
          type: string
          nullable: true
        customerId:
          type: integer
          nullable: true
        visitId:
          type: integer
          nullable: true
        createdAt:
          type: string

    SimulatePosEventRequest:
      type: object
      required: [vendor, kind]
      properties:
        vendor:
          type: string
          enum: [square, clover, boulevard, vagaro, custom]
        kind:
          type: string
          enum: [check_in, service_completed, perk_redeemed]
        externalEventId:
          type: string
          nullable: true
        customerName:
          type: string
          nullable: true
        customerPhone:
          type: string
          nullable: true
        customerEmail:
          type: string
          nullable: true
        serviceType:
          type: string
          nullable: true
        staffName:
          type: string
          nullable: true
        paymentAmount:
          type: number
          nullable: true
        perkToken:
          type: string
          nullable: true

    SimulatePosEventResult:
      type: object
      required: [received, status, detail, payload]
      properties:
        received:
          type: boolean
        status:
          type: string
        detail:
          type: string
          nullable: true
        payload:
          type: string
          description: The vendor-shaped JSON payload that was posted through the pipeline.

    GatewayToken:
      type: object
      required: [id, label, tokenPrefix, sandbox, status, lastUsedAt, rotatedAt, revokedAt, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        tokenPrefix:
          type: string
          description: Non-secret display prefix; the full token is never recoverable.
        sandbox:
          type: boolean
        status:
          type: string
          enum: [active, revoked]
        lastUsedAt:
          type: string
          nullable: true
        rotatedAt:
          type: string
          nullable: true
        revokedAt:
          type: string
          nullable: true
        createdAt:
          type: string

    GatewayTokenWithSecret:
      allOf:
        - $ref: "#/components/schemas/GatewayToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The full bearer token — shown exactly once at creation/rotation.

    CreateGatewayTokenRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        sandbox:
          type: boolean
          nullable: true
          description: Sandbox tokens exercise the same endpoints against isolated test data and never touch live records.

    GatewayApiCall:
      type: object
      required: [id, tokenLabel, method, path, httpStatus, outcome, detail, sandbox, createdAt]
      properties:
        id:
          type: integer
        tokenLabel:
          type: string
          nullable: true
        method:
          type: string
        path:
          type: string
        httpStatus:
          type: integer
        outcome:
          type: string
          description: ok | auth_failed | invalid | rejected | error
        detail:
          type: string
          nullable: true
        sandbox:
          type: boolean
        createdAt:
          type: string

    CoopPartnership:
      type: object
      required:
        [
          id,
          hostTenantId,
          hostTenantName,
          partnerTenantId,
          partnerTenantName,
          perkTitle,
          perkDescription,
          redemptionCode,
          industryBarrierOverridden,
          status,
          requestedByTenantId,
          mutualRewardTerms,
          perkStartsAt,
          perkEndsAt,
          disputeSuspended,
          bannedAt,
          hostTrackingCode,
          partnerTrackingCode,
          tier,
          hostReciprocityThreshold,
          partnerReciprocityThreshold,
          performancePausedAt,
          reactivationRequestedByTenantId,
          proposedPerkTitle,
          proposedPerkDescription,
          proposedMutualRewardTerms,
          renegotiationRequestedByTenantId,
          isActive,
          createdAt,
        ]
      properties:
        id:
          type: integer
        hostTenantId:
          type: integer
        hostTenantName:
          type: string
        partnerTenantId:
          type: integer
        partnerTenantName:
          type: string
        perkTitle:
          type: string
        perkDescription:
          type: ["string", "null"]
        redemptionCode:
          type: string
        industryBarrierOverridden:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, declined]
          description: Invite lifecycle; admin-created partnerships are accepted from the start.
        requestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that initiated the invite; null for admin-created partnerships.
        mutualRewardTerms:
          type: ["string", "null"]
        perkStartsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk goes live; null = active immediately.
        perkEndsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk expires; null = never expires.
        disputeSuspended:
          type: boolean
          description: True when an escalated dispute paused the perk and hid the partnership until an admin reinstates it.
        bannedAt:
          type: ["string", "null"]
          description: Set when a platform admin permanently banned the partnership.
        hostTrackingCode:
          type: ["string", "null"]
          description: Tracking code carried by the host's customers (host→partner traffic); null only until backfilled.
        partnerTrackingCode:
          type: ["string", "null"]
          description: Tracking code carried by the partner's customers (partner→host traffic); null only until backfilled.
        tier:
          type: string
          enum: [premier, standard]
          description: Performance-based tier, evaluated against rolling 30-day attribution counts.
        hostReciprocityThreshold:
          type: ["integer", "null"]
          description: Customers/30 days the host demands of partner→host traffic; null = platform default (5).
        partnerReciprocityThreshold:
          type: ["integer", "null"]
          description: Customers/30 days the partner demands of host→partner traffic; null = platform default (5).
        performancePausedAt:
          type: ["string", "null"]
          description: Set when the evaluator paused the partnership for zero 30-day traffic; the perk is hidden from all customer surfaces while set.
        reactivationRequestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that requested reactivation of a performance pause; cleared when the pause lifts.
        proposedPerkTitle:
          type: ["string", "null"]
          description: Pending re-negotiation perk title; null when no proposal is pending.
        proposedPerkDescription:
          type: ["string", "null"]
        proposedMutualRewardTerms:
          type: ["string", "null"]
        renegotiationRequestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that proposed the pending re-negotiation; null when none is pending.
        isActive:
          type: boolean
        createdAt:
          type: string

    CoopDispute:
      type: object
      required:
        [
          id,
          partnershipId,
          perkTitle,
          reportingTenantId,
          reportingTenantName,
          reportedTenantId,
          reportedTenantName,
          category,
          details,
          status,
          graceDeadlineAt,
          escalatedAt,
          resolvedAt,
          withdrawnAt,
          mediationNotes,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        partnershipId:
          type: integer
        perkTitle:
          type: string
        reportingTenantId:
          type: integer
        reportingTenantName:
          type: string
        reportedTenantId:
          type: integer
        reportedTenantName:
          type: string
        category:
          type: string
          enum:
            - Partner refusing valid digital perk
            - Inappropriate business conduct
            - Closed storefront/unresponsive
        details:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, escalated, resolved, withdrawn, banned]
        graceDeadlineAt:
          type: string
          description: End of the 7-business-day resolution window computed at filing time.
        escalatedAt:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        withdrawnAt:
          type: ["string", "null"]
        mediationNotes:
          type: ["string", "null"]
          description: Append-only timestamped mediation log kept by platform admins.
        createdAt:
          type: string
        updatedAt:
          type: string

    CoopDisputeCreate:
      type: object
      required: [partnershipId, category]
      properties:
        partnershipId:
          type: integer
        category:
          type: string
          enum:
            - Partner refusing valid digital perk
            - Inappropriate business conduct
            - Closed storefront/unresponsive
        details:
          type: string

    CoopDisputeMediationNote:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
    CoopRenegotiationPropose:
      type: object
      properties:
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: ["string", "null"]
        mutualRewardTerms:
          type: ["string", "null"]

    CoopLedgerCounts:
      type: object
      required: [inbound, outbound]
      properties:
        inbound:
          type: integer
        outbound:
          type: integer

    CoopLedgerEntry:
      type: object
      required:
        [
          partnershipId,
          partnerTenantId,
          partnerName,
          perkTitle,
          status,
          isActive,
          window,
          allTime,
          ratio,
          disparityPercent,
          flagged,
        ]
      properties:
        partnershipId:
          type: integer
        partnerTenantId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        isActive:
          type: boolean
        window:
          $ref: "#/components/schemas/CoopLedgerCounts"
        allTime:
          $ref: "#/components/schemas/CoopLedgerCounts"
        ratio:
          type: ["number", "null"]
          description: inbound / outbound over the window; null when outbound is 0.
        disparityPercent:
          type: number
          description: "|inbound − outbound| / max(inbound, outbound) × 100 over the evaluation window; 0 when there is no traffic."
        flagged:
          type: boolean
          description: True when the tenant's reciprocity threshold is set and this partnership's disparity exceeds it.

    CoopLedgerResponse:
      type: object
      required: [windowDays, evaluationWindowDays, marginPercent, entries]
      properties:
        windowDays:
          type: integer
          description: Recent-window size the window counts cover.
        evaluationWindowDays:
          type: integer
          description: Window used for threshold flagging (the tenant's configured evaluation window).
        marginPercent:
          type: ["integer", "null"]
          description: The tenant's configured disparity margin; null = flagging off.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CoopLedgerEntry"

    CoopDirectoryEntry:
      type: object
      required: [id, name, category, subCategory, industry, distanceMiles, city, sameIndustry, samePlaza, plazaConflict]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        subCategory:
          type: ["string", "null"]
          description: Curated Level 2 sub-category label; null when the business is unclassified.
        industry:
          type: ["string", "null"]
          description: Curated Level 1 industry label; null when the business is unclassified.
        distanceMiles:
          type: ["number", "null"]
          description: Distance from the requesting business in miles; null when either side lacks coordinates.
        city:
          type: ["string", "null"]
        sameIndustry:
          type: boolean
          description: True when this business shares the requester's Level 1 industry (different sub-niche — pairing still allowed). Direct same-sub-category competitors never appear at all.
        samePlaza:
          type: boolean
          description: True when this business shares the requester's commercial complex (same address block + postal code, or lat/long proximity).
        plazaConflict:
          type: boolean
          description: True when inviting this business would violate plaza exclusivity — its category is already held by one of the requester's active same-plaza partnerships.

    CoopTaxonomySubCategory:
      type: object
      required: [slug, label]
      properties:
        slug:
          type: string
        label:
          type: string

    CoopTaxonomyIndustry:
      type: object
      required: [slug, label, subCategories]
      properties:
        slug:
          type: string
        label:
          type: string
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/CoopTaxonomySubCategory"

    CoopSuggestionProposal:
      type: object
      required: [perkTitle, perkDescription, mutualRewardTerms]
      properties:
        perkTitle:
          type: string
        perkDescription:
          type: string
        mutualRewardTerms:
          type: string

    CoopSuggestion:
      type: object
      required: [tenantId, name, category, city, distanceMiles, score, reasons, proposal]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
          description: Curated sub-category label when classified, else the raw category string.
        city:
          type: ["string", "null"]
        distanceMiles:
          type: ["number", "null"]
          description: Distance from the requesting business in miles; null when either side lacks coordinates.
        score:
          type: integer
          description: Complementary-fit score, 0-100 (higher = better match).
        reasons:
          type: array
          items:
            type: string
          description: Human-readable match reasons shown on the suggestion card.
        proposal:
          $ref: "#/components/schemas/CoopSuggestionProposal"

    CoopSuggestionDismissResult:
      type: object
      required: [dismissed]
      properties:
        dismissed:
          type: boolean

    CoopPlazaConflict:
      type: object
      required:
        [
          id,
          requesterTenantId,
          requesterTenantName,
          blockedPartnerTenantId,
          blockedPartnerTenantName,
          existingPartnershipId,
          existingPartnerTenantName,
          category,
          status,
          releasedAt,
          createdAt,
        ]
      properties:
        id:
          type: integer
        requesterTenantId:
          type: integer
        requesterTenantName:
          type: string
        blockedPartnerTenantId:
          type: integer
        blockedPartnerTenantName:
          type: string
        existingPartnershipId:
          type: ["integer", "null"]
        existingPartnerTenantName:
          type: ["string", "null"]
        category:
          type: string
        status:
          type: string
          enum: [active, released]
        releasedAt:
