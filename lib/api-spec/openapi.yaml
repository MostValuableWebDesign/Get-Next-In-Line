      tags: [concierge]
      summary: Suggest active add-ons/enhancements compatible with a service selection for a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeSuggestUpsellsInput"
      responses:
        "200":
          description: Compatible upsell suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeSuggestUpsellsResult"
        "404":
          description: Tenant not found

  /concierge/dispatch-message:
    post:
      operationId: dispatchConciergeMessage
      tags: [concierge]
      summary: Dispatch a message to a client via their preferred channel and record an audit log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeDispatchMessageInput"
      responses:
        "201":
          description: Message dispatched (or simulated) and logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeMessageLog"
        "404":
          description: Tenant or client profile not found
        "409":
          description: Client cannot receive messages (opted out or missing contact info)

  /v1/partners:
    get:
      operationId: listPartnerConnections
      tags: [partners]
      summary: List all partner-direct modules with the tenant's connection state
      responses:
        "200":
          description: Partner modules with connection state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerConnectionSummary"

  /v1/partners/{partnerId}/connect:
    post:
      operationId: connectPartner
      tags: [partners]
      summary: Initiate the OAuth-style handshake for a partner module
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handshake initiated — connection is pending authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectResult"
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/callback:
    post:
      operationId: completePartnerAuthorization
      tags: [partners]
      summary: OAuth authorization callback — exchanges the code and activates the connection
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerCallbackBody"
      responses:
        "200":
          description: Connection activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "400":
          description: Invalid or expired handshake state
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/status:
    get:
      operationId: getPartnerConnectionStatus
      tags: [partners]
      summary: Connection status, last sync, and audit history for a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection status with recent audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/disconnect:
    post:
      operationId: disconnectPartner
      tags: [partners]
      summary: Disconnect a partner integration and purge stored credentials
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "404":
          description: Partner not found

  /public/booking/{slug}:
    get:
      operationId: getPublicBookingConfig
      tags: [public-booking]
      summary: Public (unauthenticated) booking config for a business — branding, service menu, and staff, keyed by the tenant's subdomain slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingConfig"
        "404":
          description: Business not found

  /public/booking/{slug}/availability:
    post:
      operationId: getPublicBookingAvailability
      tags: [public-booking]
      summary: Compute genuinely available time slots for a service on a given day (respects business hours and existing bookings)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicAvailabilityInput"
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailabilityResponse"
        "404":
          description: Business not found

  /public/booking/{slug}/appointments:
    post:
      operationId: createPublicBooking
      tags: [public-booking]
      summary: Book an appointment publicly with just name + phone/email — validated against availability with duplicate and conflict guards
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingInput"
      responses:
        "201":
          description: Confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingConfirmation"
        "404":
          description: Business not found
        "409":
          description: Slot no longer available or duplicate booking
        "429":
          description: Too many booking attempts

  /wallet/login/request:
    post:
      operationId: requestWalletLoginCode
      tags: [wallet]
      summary: Request an SMS sign-in code for the customer Local Perks wallet (public, rate limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletLoginRequest"
      responses:
        "200":
          description: Code sent (or simulated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletLoginRequestResult"
        "400":
          description: Invalid phone number
        "429":
          description: Too many code requests

  /wallet/login/verify:
    post:
      operationId: verifyWalletLoginCode
      tags: [wallet]
      summary: Exchange a received SMS code for a wallet session token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletLoginVerify"
      responses:
        "200":
          description: Verified — wallet session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSessionResult"
        "400":
          description: Wrong, expired, or missing code
        "429":
          description: Too many verification attempts

  /wallet/passes:
    get:
      operationId: listWalletPasses
      tags: [wallet]
      summary: List all of the signed-in customer's perk passes across businesses (x-wallet-session header)
      responses:
        "200":
          description: The customer's passes, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletPassList"
        "401":
          description: Missing or expired wallet session

  /wallet/passes/{id}:
    get:
      operationId: getWalletPass
      tags: [wallet]
      summary: One perk pass with its QR payload (x-wallet-session header)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletPassDetail"
        "401":
          description: Missing or expired wallet session
        "404":
          description: Pass not found (or not owned by this session)

components:
  schemas:
    CoopPartnership:
      type: object
      required:
        [
          id,
          hostTenantId,
          hostTenantName,
          partnerTenantId,
          partnerTenantName,
          perkTitle,
          perkDescription,
          redemptionCode,
          industryBarrierOverridden,
          status,
          requestedByTenantId,
          mutualRewardTerms,
          perkStartsAt,
          perkEndsAt,
          isActive,
          createdAt,
        ]
      properties:
        id:
          type: integer
        hostTenantId:
          type: integer
        hostTenantName:
          type: string
        partnerTenantId:
          type: integer
        partnerTenantName:
          type: string
        perkTitle:
          type: string
        perkDescription:
          type: ["string", "null"]
        redemptionCode:
          type: string
        industryBarrierOverridden:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, declined]
          description: Invite lifecycle; admin-created partnerships are accepted from the start.
        requestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that initiated the invite; null for admin-created partnerships.
        mutualRewardTerms:
          type: ["string", "null"]
        perkStartsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk goes live; null = active immediately.
        perkEndsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk expires; null = never expires.
        isActive:
          type: boolean
        createdAt:
          type: string

    CoopDirectoryEntry:
      type: object
      required: [id, name, category, subCategory, industry, distanceMiles, city, sameIndustry]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        subCategory:
          type: ["string", "null"]
          description: Curated Level 2 sub-category label; null when the business is unclassified.
        industry:
          type: ["string", "null"]
          description: Curated Level 1 industry label; null when the business is unclassified.
        distanceMiles:
          type: ["number", "null"]
          description: Distance from the requesting business in miles; null when either side lacks coordinates.
        city:
          type: ["string", "null"]
        sameIndustry:
          type: boolean
          description: True when this business shares the requester's Level 1 industry (different sub-niche — pairing still allowed). Direct same-sub-category competitors never appear at all.

    CoopTaxonomySubCategory:
      type: object
      required: [slug, label]
      properties:
        slug:
          type: string
        label:
          type: string

    CoopTaxonomyIndustry:
      type: object
      required: [slug, label, subCategories]
      properties:
        slug:
          type: string
        label:
          type: string
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/CoopTaxonomySubCategory"

    CoopInviteCreate:
      type: object
      required: [partnerTenantId, perkTitle]
      properties:
        partnerTenantId:
          type: integer
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: string
        mutualRewardTerms:
          type: string
        perkStartsAt:
          type: string
          format: date-time
        perkEndsAt:
          type: string
          format: date-time

    CoopInviteRespond:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, decline]

    CoopActivePerk:
      type: object
      required: [id, perkTitle, perkDescription, mutualRewardTerms, partnerName, redemptionCode, perkEndsAt]
      properties:
        id:
          type: integer
        perkTitle:
          type: string
        perkDescription:
          type: ["string", "null"]
        mutualRewardTerms:
          type: ["string", "null"]
        partnerName:
          type: string
        redemptionCode:
          type: string
        perkEndsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk expires; null = never expires.

    CoopActivePerksResponse:
      type: object
      required: [disclaimer, perks]
      properties:
        disclaimer:
          type: string
          description: Platform liability disclaimer that must accompany every displayed perk.
        perks:
          type: array
          items:
            $ref: "#/components/schemas/CoopActivePerk"

    WalletLoginRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 7
          description: The customer's mobile phone number (any common format; normalized server-side).

    WalletLoginRequestResult:
      type: object
      required: [sent, phone]
      properties:
        sent:
          type: boolean
        phone:
          type: string
          description: The normalized (E.164) phone the code was sent to.

    WalletLoginVerify:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 7
        code:
          type: string
          minLength: 4
          description: The 6-digit code received by SMS.

    WalletSessionResult:
      type: object
      required: [token, phone, expiresAt]
      properties:
        token:
          type: string
          description: Bearer token for the x-wallet-session header on wallet reads.
        phone:
          type: string
        expiresAt:
          type: string

    WalletPass:
      type: object
      required:
        [
          id,
          perkTitle,
          perkDescription,
          redeemAtBusinessName,
          grantedByBusinessName,
          status,
          token,
          grantedAt,
          expiresAt,
          redeemedAt,
        ]
      properties:
        id:
          type: integer
        perkTitle:
          type: string
        perkDescription:
          type: ["string", "null"]
        redeemAtBusinessName:
          type: string
          description: The partner business where this pass is redeemed.
        grantedByBusinessName:
          type: string
          description: The business whose visit deposited the pass.
        status:
          type: string
          enum: [active, redeemed, expired]
        token:
          type: string
          description: Unguessable redemption token (the QR payload).
        grantedAt:
          type: string
        expiresAt:
          type: string
        redeemedAt:
          type: ["string", "null"]

    WalletPassList:
      type: object
      required: [phone, passes]
      properties:
        phone:
          type: string
        passes:
          type: array
          items:
            $ref: "#/components/schemas/WalletPass"

    WalletPassDetail:
      allOf:
        - $ref: "#/components/schemas/WalletPass"
        - type: object
          required: [qrPayload]
          properties:
            qrPayload:
              type: string
              description: Exact string to encode in the pass QR code.

    CoopPerkRedeemRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: The partnership's redemption code, or a scanned wallet pass token (WPASS-…) which carries its own single-use state.
        passCode:
          type: string
          minLength: 1
          description: The specific customer pass/code instance being redeemed (locked after one use). Required for classic redemption codes; omitted for wallet pass tokens.

    CoopPerkRedeemResult:
      type: object
      required: [valid, reason, partnership, redeemedAt]
      properties:
        valid:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why redemption failed (unknown code, inactive, not started, expired, already redeemed); null when valid.
        partnership:
          oneOf:
            - $ref: "#/components/schemas/CoopPartnership"
            - type: "null"
        redeemedAt:
          type: ["string", "null"]
          description: When this pass instance was redeemed; set on success and on already-redeemed rejections.

    CoopPartnerPerformance:
      type: object
      required:
        [partnershipId, partnerTenantId, partnerName, perkTitle, isActive, impressions, claims, clientsSent, clientsReceived, revenueInfluenced]
      properties:
        partnershipId:
          type: integer
        partnerTenantId:
          type: integer
        partnerName:
          type: string
        perkTitle:
          type: string
        isActive:
          type: boolean
        impressions:
          type: integer
          description: Perk blocks shown to this business's customers (checkout, receipts, passes, public landing).
        claims:
          type: integer
          description: Redemption codes validated/redeemed at this business.
        clientsSent:
          type: integer
          description: Cross-over visits recorded at the partner (customers this business sent).
        clientsReceived:
          type: integer
          description: Cross-over visits recorded at this business (customers the partner sent).
        revenueInfluenced:
          type: number
          description: Estimated checkout revenue attributed to cross-over visits at this business.

    CoopMonthlyReport:
      type: object
      required: [id, month, impressions, claims, crossoverVisits, revenueInfluenced, createdAt]
      properties:
        id:
          type: integer
        month:
          type: string
          description: Calendar month key, e.g. "2026-06".
        impressions:
          type: integer
        claims:
          type: integer
        crossoverVisits:
          type: integer
        revenueInfluenced:
          type: number
        createdAt:
          type: string

    CoopPartnershipCreate:
      type: object
      required: [hostTenantId, partnerTenantId, perkTitle]
      properties:
        hostTenantId:
          type: integer
        partnerTenantId:
          type: integer
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: string
        redemptionCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,30}[A-Za-z0-9]$"
          description: Optional explicit redemption code; auto-generated when omitted.
        overrideIndustryBarrier:
          type: boolean
          description: Explicitly bypass the same-category (competitor) block.
        perkStartsAt:
          type: string
          format: date-time
        perkEndsAt:
          type: string
          format: date-time

    CoopPartnershipUpdate:
      type: object
      properties:
        perkTitle:
          type: string
          minLength: 1
        perkDescription:
          type: ["string", "null"]
        redemptionCode:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9-]{2,30}[A-Za-z0-9]$"
        isActive:
          type: boolean
        perkStartsAt:
          type: ["string", "null"]
          format: date-time
        perkEndsAt:
          type: ["string", "null"]
          format: date-time

    PlatformInvite:
      type: object
      required:
        [
          id,
          invitedBusinessName,
          invitedContact,
          status,
          inviteUrl,
          message,
          resultingTenantId,
          expiresAt,
          createdAt,
        ]
      properties:
        id:
          type: integer
        invitedBusinessName:
          type: string
        invitedContact:
          type: ["string", "null"]
        status:
          type: string
          enum: [sent, clicked, registered, expired]
        inviteUrl:
          type: string
          description: Absolute trackable link the merchant shares with the invited business.
        message:
          type: string
          description: Ready-to-copy SMS/email message including the incentive copy and the link.
        resultingTenantId:
          type: ["integer", "null"]
          description: Tenant created through this invite, once registered.
        expiresAt:
          type: string
        createdAt:
          type: string

    PlatformInviteCreate:
      type: object
      required: [businessName]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 120
        contact:
          type: string
          maxLength: 200
          description: Optional phone/email note for the merchant's own tracking.

    PublicPlatformInvite:
      type: object
      required: [inviterBusinessName, invitedBusinessName, status]
      properties:
        inviterBusinessName:
          type: string
        invitedBusinessName:
          type: string
        status:
          type: string
          enum: [sent, clicked, registered, expired]
          description: Registration is only possible while sent/clicked.

    PlatformInviteRegistration:
      type: object
      required: [businessName, subdomain]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 120
        contactName:
          type: string
          maxLength: 120
        contactEmail:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 120
          description: Business category, e.g. HairSalon or CafeOrCoffeeShop.
        subdomain:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,60}[a-z0-9]$"

    PlatformInviteRegistrationResult:
      type: object
      required: [tenantId, subdomain, brandName, partnershipCreated, partnershipBlockedReason]
      properties:
        tenantId:
          type: integer
        subdomain:
          type: string
        brandName:
          type: string
        partnershipCreated:
          type: boolean
          description: False when the same-industry guardrail blocked the auto-created partnership.
        partnershipBlockedReason:
          type: ["string", "null"]

    CoopIndustryBarrierError:
      type: object
      required: [message, sharedCategories]
      properties:
        message:
          type: string
        sharedCategories:
          type: array
          items:
            type: string

    CoopRedemptionValidation:
      type: object
      required: [valid, reason, partnership]
      properties:
        valid:
          type: boolean
        reason:
          type: ["string", "null"]
          description: Why validation failed (unknown code, inactive partnership); null when valid.
        partnership:
          oneOf:
            - $ref: "#/components/schemas/CoopPartnership"
            - type: "null"

    AdminCampaign:
      type: object
      required: [id, code, tenantId, tenantName, name, isActive, clickCount, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        tenantId:
          type: integer
        tenantName:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        clickCount:
          type: integer
        createdAt:
          type: string

    AdminCampaignCreate:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          type: integer
        name:
          type: string
          minLength: 1
        code:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$"
          description: Optional explicit code; generated from the name when omitted.

    AdminCampaignUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    PublicBookingService:
      type: object
      required: [id, name, category, description, price, durationMinutes]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        durationMinutes:
          type: ["integer", "null"]

    PublicBookingStaff:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    PublicBookingConfig:
      type: object
      required: [slug, brandName, businessName, industryType, resourceLabel, openTime, closeTime, services, staff]
      properties:
        slug:
          type: string
        brandName:
          type: string
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
          description: What this business calls a bookable staff member/resource (e.g. "Chair", "Stylist").
        openTime:
          type: string
        closeTime:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingService"
        staff:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingStaff"

    PublicAvailabilityInput:
      type: object
      required: [serviceId, date]
      properties:
        serviceId:
          type: integer
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: Local calendar date (yyyy-mm-dd) to compute slots for.
        resourceId:
          type: integer
          description: Optional preferred staff member/resource.

    PublicTimeSlot:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
        endsAt:
          type: string

    PublicAvailabilityResponse:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/PublicTimeSlot"

    PublicBookingInput:
      type: object
      required: [serviceId, startsAt, name]
      properties:
        serviceId:
          type: integer
        startsAt:
          type: string
        resourceId:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        email:
          type: string
          maxLength: 254

    PublicBookingConfirmation:
      type: object
      required: [appointmentId, serviceType, startsAt, endsAt, businessName]
      properties:
        appointmentId:
          type: integer
        serviceType:
          type: string
        startsAt:
          type: string
        endsAt:
          type: string
        businessName:
          type: string
        staffName:
          type: ["string", "null"]

    PartnerConnectionSummary:
      type: object
      required: [partnerId, moduleId, moduleName, partnerBrand, isActive, status, lastSyncAt, connectedAt]
      properties:
        partnerId:
          # URL-safe key derived from the customer-facing partner brand
          # (e.g. "deel", "next-insurance"). No internal slugs or connector
          # details are exposed here.
          type: string
        moduleId:
          type: integer
        moduleName:
          type: string
        partnerBrand:
