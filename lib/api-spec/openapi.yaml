        noShowDepositAmount:
          type: number
          minimum: 0
        noShowCancellationWindowHours:
          type: integer
          minimum: 0
        noShowFee:
          type: number
          minimum: 0
        defaultCycleDays:
          type: integer
          minimum: 1
        seoDescription:
          type: string
        publicPhone:
          type: string
        streetAddress:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postalCode:
          type: string
        latitude:
          type: string
          pattern: "^$|^-?\\d{1,2}(\\.\\d+)?$"
        longitude:
          type: string
          pattern: "^$|^-?\\d{1,3}(\\.\\d+)?$"
        businessCategory:
          type: string
        coopSubCategory:
          type: string
          description: Curated Level 2 sub-category slug; empty string switches back to auto-derivation.
        coopRadiusMiles:
          type: integer
          minimum: 1
          maximum: 15
        coopRadiusOverrideMiles:
          type: ["number", "null"]
          minimum: 0.5
          maximum: 50
          description: Merchant override of the co-op radius (miles). Send null to revert to automatic.
        coopReciprocityMarginPercent:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        coopReciprocityWindowDays:
          type: integer
          minimum: 1
          maximum: 365
        brandLogoUrl:
