      properties:
        tenantId:
          type: integer
        tenantName:
          type: string
        status:
          type: ["string", "null"]
          description: open | temporarily_closed | safe — null while the tenant hasn't checked in yet.
        note:
          type: ["string", "null"]
        checkedInAt:
          type: ["string", "null"]

    EmergencyBroadcastCreate:
      type: object
      required: [severity, alertType, headline, message]
      properties:
        severity:
          type: string
          enum: [info, warning, critical]
        alertType:
          type: string
          enum: [weather_closure, power_outage, safety_alert, schedule_change, other]
        headline:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 1000
        scope:
          type: string
          enum: [platform, selected]
          description: Admin-only targeting; merchant broadcasts always use their co-op network.
        targetTenantIds:
          type: array
          items:
            type: integer
          description: Required when scope is "selected".

    EmergencyCheckinCreate:
      type: object
      required: [status]
      properties:
        status:
