    SosStaffEarningsRow:
      type: object
      description: >
        One staff member's summary for the requested period. Commission staff:
        attributedRevenue sums the payment amounts persisted at checkout on
        attributed visits, and commissionEarned is their split of that.
        Flat-fee staff: amountDue is what the shop owes them for the period
        cadence. Booth-rent staff: amountDue is what they owe the shop.
      required:
        [staffId, name, isActive, compensationType, commissionPercent, amount, cadence, attributedVisits, attributedRevenue, commissionEarned, amountDue]
      properties:
        staffId:
          type: integer
        name:
          type: string
        isActive:
          type: boolean
        compensationType:
          type: string
          enum: [commission, flat_fee, booth_rent]
        commissionPercent:
          type: ["integer", "null"]
        amount:
          type: ["number", "null"]
        cadence:
          type: ["string", "null"]
        # Visits checked out in the period attributed to this staff member.
        attributedVisits:
          type: integer
        # Sum of persisted payment amounts on those visits.
        attributedRevenue:
          type: number
        # commission only: attributedRevenue × commissionPercent / 100.
        commissionEarned:
          type: ["number", "null"]
        # flat_fee / booth_rent only: rent or fee for the period cadence.
        amountDue:
          type: ["number", "null"]

