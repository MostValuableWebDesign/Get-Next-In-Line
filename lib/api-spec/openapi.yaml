openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Get Next In Line — GHL + GNIL OS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agency
    description: Agency command center
  - name: tenants
    description: Tenant provisioning and management
  - name: modules
    description: Service modules and pricing
  - name: billing
    description: Billing and checkout simulation
  - name: admin
    description: Admin-only operations (never exposed to tenants)
  - name: partners
    description: Partner-Direct Integrations — connection handshakes and status (webhook listener is server-to-server only, outside this spec)
  - name: sos
    description: SOS operations platform — resources, visits, waitlist, appointments, AI receptionist
  - name: gateway
    description: Co-Op Developer API Gateway — bearer-token management and API call log (public /v1/gateway endpoints are server-to-server, outside this spec)
  - name: public-booking
    description: Public (no-login) direct-booking flow — service menu, availability, and booking keyed by tenant slug
  - name: governance
    description: Network Governance — hierarchical roles, user accounts, and the co-op join-application review queue

paths:
  /governance/users:
    get:
      operationId: listGovernanceUsers
      tags: [governance]
      summary: List network user accounts with roles and tenant scopes (super-admin only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceUserList"
    post:
      operationId: createGovernanceUser
      tags: [governance]
      summary: Create a network user account with a role and tenant scope (super-admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceUserCreate"
      responses:
        "201":
          description: Created user — includes the one-time login token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceUserCreated"
        "409":
          description: Username already taken

  /governance/users/{id}:
    patch:
      operationId: updateGovernanceUser
      tags: [governance]
      summary: Update a user's role and/or assigned tenant scope (super-admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceUser"
        "404":
          description: Not found
    delete:
      operationId: deleteGovernanceUser
      tags: [governance]
      summary: Delete a network user account (super-admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /governance/users/{id}/rotate-token:
    post:
      operationId: rotateGovernanceUserToken
      tags: [governance]
      summary: Issue a fresh one-time login token for a user (super-admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: New login token (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceTokenRotation"
        "404":
          description: Not found

  /governance/applications:
    get:
      operationId: listCoopApplications
      tags: [governance]
      summary: Co-op join application review queue (super-admin and district managers)
      responses:
        "200":
          description: Applications, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopApplicationList"

  /governance/applications/{id}:
    patch:
      operationId: reviewCoopApplication
      tags: [governance]
      summary: Move an application through its lifecycle and record vetting notes; approving provisions the tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopApplicationReview"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopApplicationReviewOutcome"
        "404":
          description: Not found
        "409":
          description: Illegal status transition or subdomain conflict

  /public/coop/applications:
    post:
      operationId: submitCoopApplication
      tags: [governance]
      summary: Public application form — a business applies to join the co-op network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopApplicationSubmission"
      responses:
        "201":
          description: Application received — statusToken drives the status page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopApplicationSubmitted"
        "409":
          description: Requested web address already taken

  /public/coop/applications/{token}:
    get:
      operationId: getPublicCoopApplicationStatus
      tags: [governance]
      summary: Applicant-facing application status
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCoopApplicationStatus"
        "404":
          description: Not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz/ready:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check — DB connectivity and worker heartbeat
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Degraded or unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /agency/dashboard:
    get:
      operationId: getAgencyDashboard
      tags: [agency]
      summary: Get agency dashboard summary — MRR, tenant counts, revenue totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyDashboard"

  /agency/settings:
    get:
      operationId: getAgencySettings
      tags: [agency]
      summary: Get global agency settings including markup percentage
      responses:
        "200":
          description: Agency settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"
    patch:
      operationId: updateAgencySettings
      tags: [agency]
      summary: Update global agency settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencySettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencySettings"

  /agency/master-overview:
    get:
      operationId: getMasterOverview
      tags: [agency]
      summary: Network-wide executive KPIs and cross-business financial flows
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [this_month, last_month]
      responses:
        "200":
          description: Master overview KPIs for the selected period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterOverview"

  /agency/settlement/preview:
    get:
      operationId: previewSettlementCycle
      tags: [agency]
      summary: Preview unsettled inter-business obligations and their pairwise netting for a window
      parameters:
        - name: periodStart
          in: query
          required: true
          schema:
            type: string
        - name: periodEnd
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unsettled entries and the statements a run would produce
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementPreview"

  /agency/settlement/run:
    post:
      operationId: runSettlement
      tags: [agency]
      summary: Execute an end-of-cycle settlement run over a date window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRunRequest"
      responses:
        "201":
          description: Settlement cycle executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementCycleDetail"
        "400":
          description: No unsettled entries in the window, or invalid window
        "409":
          description: Another settlement run is already in progress

  /agency/settlement/cycles:
    get:
      operationId: listSettlementCycles
      tags: [agency]
      summary: List past settlement cycles, newest first
      responses:
        "200":
          description: Past settlement cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettlementCycle"

  /agency/settlement/cycles/{cycleId}/payouts:
    post:
      operationId: runSettlementPayouts
      tags: [agency]
      summary: Execute (or retry) payouts for a closed cycle's net-positive statements — idempotent, never double-pays
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payout run outcome per statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementPayoutRunResult"
        "404":
          description: Cycle not found
        "409":
          description: Another payout run for this cycle is already in progress

  /agency/settlement/cycles/{cycleId}:
    get:
      operationId: getSettlementCycle
      tags: [agency]
      summary: A past settlement cycle with its per-tenant statements
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cycle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementCycleDetail"
        "404":
          description: Cycle not found

  /agency/settlement/cycles/{cycleId}/statements/{tenantId}:
    get:
      operationId: getSettlementStatement
      tags: [agency]
      summary: A tenant's settlement statement with its underlying ledger entries
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            type: integer
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Statement detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementStatementDetail"
        "404":
          description: Statement not found

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all provisioned tenants
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of tenants per page (default 100, max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          required: false
          description: Number of tenants to skip (default 0)
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Provision a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/activity:
    get:
      operationId: getTenantActivity
      tags: [tenants]
      summary: Recent tenant provisioning and status change activity feed
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Filter activity to a single tenant
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: Maximum number of items per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before_timestamp
          in: query
          required: false
          description: Keyset cursor — return items strictly older than this (timestamp, id) pair. Must be paired with before_id.
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          required: false
          description: Keyset cursor id tiebreaker; must be paired with before_timestamp.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantActivityPage"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a single tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant status or details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Remove a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tenants/{id}/modules:
    get:
      operationId: getTenantModules
      tags: [tenants]
      summary: List modules a tenant is subscribed to
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules the tenant is subscribed to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSubscribedModule"
        "404":
          description: Tenant not found

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List all service modules with wholesale and resale pricing
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/pricing:
    get:
      operationId: getModulesPricing
      tags: [modules]
      summary: Get all module pricing with current markup applied
      responses:
        "200":
          description: Pricing with markup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModulePricing"

  /modules/tenant-counts:
    get:
      operationId: getModuleTenantCounts
      tags: [modules]
      summary: Get count of active tenants subscribed to each module
      responses:
        "200":
          description: Per-module active tenant counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantCount"

  /modules/{id}/tenants:
    get:
      operationId: getModuleTenants
      tags: [modules]
      summary: List tenants subscribed to a module
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenants subscribed to the module
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModuleTenantSubscriber"
        "404":
          description: Module not found

  /admin/connector-registry:
    get:
      operationId: getConnectorRegistry
      tags: [admin]
      summary: Admin-only — full module list including hidden upstream connector mapping
      responses:
        "200":
          description: Modules with hidden connector details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorRegistryEntry"

  /admin/connector-registry/{id}:
    patch:
      operationId: updateConnectorRegistryEntry
      tags: [admin]
      summary: Admin-only — update a module's hidden connector details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorRegistryEntryUpdate"
      responses:
        "200":
          description: Updated registry entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorRegistryEntry"
        "404":
          description: Not found

  /admin/modules/{id}:
    get:
      operationId: getAdminModuleDetail
      tags: [admin]
      summary: Admin-only — module connector mapping, tenant assignments, and provisioning activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connector-aware module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModuleDetail"
        "404":
          description: Module not found

  /coop/partnerships:
    get:
      operationId: listCoopPartnerships
      tags: [admin]
      summary: List the scoped tenant's co-op partnerships (as host or partner); tenant context required via x-tenant-id header or tenantId query
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Tenant scope fallback when no x-tenant-id header is set; must match the header when both are present.
          schema:
            type: integer
      responses:
        "200":
          description: Partnerships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopPartnership"
    post:
      operationId: createCoopPartnership
      tags: [admin]
      summary: Create a merchant co-op partnership between two tenants (industry barrier enforced unless overridden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipCreate"
      responses:
        "201":
          description: Created partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Host or partner tenant not found
        "409":
          description: Industry barrier — both tenants share a module category and no override was given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopIndustryBarrierError"

  /coop/partnerships/{id}:
    patch:
      operationId: updateCoopPartnership
      tags: [admin]
      summary: Edit a partnership's perk or activate/deactivate it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopPartnershipUpdate"
      responses:
        "200":
          description: Updated partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Invalid body or duplicate redemption code
        "404":
          description: Not found

  /coop/partnerships/{id}/reactivate:
    post:
      operationId: reactivateCoopPartnership
      tags: [coop]
      summary: Request (or complete, when the other side already requested) mutual reactivation of a performance-paused partnership
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partnership after the request was recorded or the pause was lifted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing tenant context
        "403":
          description: Caller is not a participant
        "404":
          description: Not found
        "409":
          description: Not performance-paused, or banned

  /coop/taxonomy:
    get:
      operationId: getCoopTaxonomy
      tags: [coop]
      summary: Curated two-level co-op taxonomy (Industry → Sub-Category)
      responses:
        "200":
          description: Taxonomy industries with their sub-categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoopTaxonomyIndustry"

  /coop/ledger:
    get:
      operationId: getCoopLedger
      tags: [coop]
      summary: Merchant-facing — per-partnership inbound/outbound traffic counts, ratio, disparity, and imbalance flags; tenant scope via x-tenant-id
      parameters:
        - name: windowDays
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Traffic ledger for partnerships the tenant participates in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopLedgerResponse"
        "400":
          description: Missing x-tenant-id header

  /coop/partnerships/{id}/renegotiate:
    post:
      operationId: proposeCoopRenegotiation
      tags: [coop]
      summary: Merchant-facing — propose revised perk/mutual-reward terms; they only replace live terms when the partner accepts; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopRenegotiationPropose"
      responses:
        "200":
          description: Partnership with the pending proposal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header or empty proposal
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found
        "409":
          description: Partnership not accepted, or a proposal is already pending

  /coop/partnerships/{id}/renegotiation/respond:
    post:
      operationId: respondToCoopRenegotiation
      tags: [coop]
      summary: Merchant-facing — the other participant accepts or declines a pending re-negotiation proposal; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoopInviteRespond"
      responses:
        "200":
          description: Partnership with the proposal applied (accept) or cleared (decline)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header or invalid body
        "403":
          description: Only the non-proposing participant can respond
        "404":
          description: Not found
        "409":
          description: No proposal is pending

  /coop/partnerships/{id}/pause:
    post:
      operationId: pauseCoopPartnership
      tags: [coop]
      summary: Merchant-facing — pause a partnership from the tenant's side; the perk stops appearing everywhere; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paused partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found

  /coop/partnerships/{id}/resume:
    post:
      operationId: resumeCoopPartnership
      tags: [coop]
      summary: Merchant-facing — resume a paused (accepted) partnership; tenant scope via x-tenant-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resumed partnership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoopPartnership"
        "400":
          description: Missing x-tenant-id header
        "403":
          description: Requesting tenant is not a participant
        "404":
          description: Not found
        "409":
          description: Only accepted partnerships can be resumed

  /coop/directory:
    get:
      operationId: listCoopDirectory
      tags: [coop]
      summary: Merchant-facing — other active businesses on the platform (name, category, city only); tenant scope via x-tenant-id
      parameters:
        - name: search
          in: query
