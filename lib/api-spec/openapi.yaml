      properties:
        id:
          type: integer
        name:
          type: string

    TipPoolBundle:
      type: object
      required: [id, partnershipId, visitIds, createdAt]
      properties:
        id:
          type: integer
        partnershipId:
          type: integer
        # Visits currently linked to the bundle (all businesses).
        visitIds:
