      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBookingConfig"
        "404":
          description: Business not found

