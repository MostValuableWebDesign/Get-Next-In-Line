        "429":
          description: Too many check-in attempts

  /public/check-in/{slug}/status/{visitId}:
    get:
      operationId: getPublicCheckInStatus
      tags: [public-booking]
      summary: Public live status for a check-in, scoped to the business slug and without customer contact details
      parameters:
        - name: slug
