      properties:
        staffId:
          type: integer
        staffName:
          type: string
        tenantId:
          type: integer
        tenantName:
          type: string
        skills:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        licenseState:
          type: ["string", "null"]
        licenseStatus:
          type: string
          enum: [unverified, verified, expired]
        averageRating:
          type: ["number", "null"]
        ratingCount:
          type: integer

    CoopCoverageOffer:
      type: object
      required:
        [id, shiftId, offeringTenantId, offeringTenantName, staffId, staffName,
         skills, licenseState, licenseStatus, averageRating, ratingCount, note,
         status, createdAt]
      properties:
        id:
          type: integer
        shiftId:
          type: integer
        offeringTenantId:
          type: integer
        offeringTenantName:
          type: string
        staffId:
          type: integer
        staffName:
          type: string
        skills:
          type: array
          items:
            type: string
        licenseState:
          type: ["string", "null"]
        licenseStatus:
          type: string
          enum: [unverified, verified, expired]
        averageRating:
          type: ["number", "null"]
        ratingCount:
          type: integer
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, declined]
        createdAt:
          type: string

    CoopCoverageRatingEntry:
      type: object
      required: [rating, comment, createdAt]
      properties:
        rating:
          type: integer
        comment:
          type: ["string", "null"]
        createdAt:
          type: string

    CoopCoverageShift:
      type: object
      required:
        [id, tenantId, tenantName, startsAt, endsAt, requiredSkill,
         requiredLicenseState, offeredHourlyRate, notes, status,
         acceptedOfferId, hoursWorked, isMine, offers, rating, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
        startsAt:
          type: string
        endsAt:
          type: string
        requiredSkill:
          type: string
        requiredLicenseState:
          type: string
        offeredHourlyRate:
          type: number
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, offered, confirmed, completed, cancelled]
        acceptedOfferId:
          type: ["integer", "null"]
        hoursWorked:
          type: ["number", "null"]
        # True when the scoped tenant posted this shift.
        isMine:
          type: boolean
        # Poster sees every offer; a partner sees only its own offers.
        offers:
          type: array
          items:
            $ref: "#/components/schemas/CoopCoverageOffer"
        rating:
          oneOf:
            - $ref: "#/components/schemas/CoopCoverageRatingEntry"
            - type: "null"
        createdAt:
          type: string

    CoopCoverageLedger:
      type: object
      required: [posted, covered]
      properties:
        # Shifts this business posted (any status).
        posted:
          type: array
          items:
            $ref: "#/components/schemas/CoopCoverageShift"
        # Shifts another business posted where one of this business's staff
        # was offered or confirmed.
        covered:
          type: array
          items:
            $ref: "#/components/schemas/CoopCoverageShift"

    SosStaffEarningsRow:
      type: object
      description: >
        One staff member's summary for the requested period. Commission staff:
        attributedRevenue sums the payment amounts persisted at checkout on
        attributed visits, and commissionEarned is their split of that.
        Flat-fee staff: amountDue is what the shop owes them for the period
        cadence. Booth-rent staff: amountDue is what they owe the shop.
      required:
        [staffId, name, isActive, compensationType, commissionPercent, amount, cadence, attributedVisits, attributedRevenue, commissionEarned, amountDue, tipsEarned, sharedTipsEarned]
      properties:
        staffId:
          type: integer
        name:
          type: string
        isActive:
          type: boolean
        compensationType:
          type: string
          enum: [commission, flat_fee, booth_rent]
        commissionPercent:
          type: ["integer", "null"]
        amount:
          type: ["number", "null"]
        cadence:
          type: ["string", "null"]
        # Visits checked out in the period attributed to this staff member.
        attributedVisits:
          type: integer
        # Sum of persisted payment amounts on those visits.
        attributedRevenue:
          type: number
        # commission only: attributedRevenue × commissionPercent / 100.
        commissionEarned:
          type: ["number", "null"]
        # flat_fee / booth_rent only: rent or fee for the period cadence.
        amountDue:
          type: ["number", "null"]
        # Pooled tips allocated to this staff member in the period (gratuity
        # ledger). Itemized separately — NEVER included in commission math.
        tipsEarned:
          type: number
        # Shared gratuities from the rule-based tip-pool ledger (partnership /
        # group-event splits) — a distinct line item, never mixed into
        # commission.
        sharedTipsEarned:
          type: number

    SosGratuityConfig:
      type: object
      description: >
        Tenant-scoped tip-pooling configuration: the default split rule plus
        each staff member's percentage share and role weight.
      required: [tipSplitRule, staff]
      properties:
        tipSplitRule:
          type: string
          enum: [equal, percentage, role_weighted]
        staff:
          type: array
          items:
            $ref: "#/components/schemas/SosGratuityStaffShare"

    SosGratuityStaffShare:
      type: object
      required: [staffId, name, isActive, tipPercent, tipRoleWeight]
      properties:
        staffId:
          type: integer
        name:
          type: string
        isActive:
          type: boolean
        tipPercent:
          type: ["integer", "null"]
        tipRoleWeight:
          type: ["integer", "null"]

    SosGratuityConfigUpdate:
      type: object
      properties:
        tipSplitRule:
          type: string
          enum: [equal, percentage, role_weighted]
        staffShares:
          type: array
          items:
            type: object
            required: [staffId]
            properties:
              staffId:
                type: integer
              tipPercent:
                type: ["integer", "null"]
                minimum: 0
                maximum: 100
              tipRoleWeight:
                type: ["integer", "null"]
                minimum: 0

    SosGratuityLedgerSummary:
      type: object
      description: >
        Auditable gratuity ledger for a period: every allocation row (visit,
        staff, rule, amount, timestamp) plus per-staff totals suitable for
        tax/end-of-shift reporting.
      required: [entries, totalsByStaff, totalDistributed]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SosGratuityLedgerEntry"
        totalsByStaff:
          type: array
          items:
            type: object
            required: [staffId, name, total]
            properties:
              staffId:
                type: integer
              name:
                type: string
              total:
                type: number
        totalDistributed:
          type: number

    SosGratuityLedgerEntry:
      type: object
      required: [id, visitId, staffId, staffName, ruleApplied, amount, createdAt]
      properties:
        id:
          type: integer
        visitId:
          type: integer
        staffId:
          type: integer
        staffName:
          type: string
        ruleApplied:
          type: string
        amount:
          type: number
        createdAt:
          type: string

    TipPoolParticipant:
      type: object
      required: [id, tenantId, tenantName, staffId, staffName, role, percent, weight]
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        tenantName:
          type: ["string", "null"]
        staffId:
          type: integer
        staffName:
          type: string
        role:
          type: ["string", "null"]
        percent:
          type: ["integer", "null"]
        weight:
          type: ["integer", "null"]

    TipPoolParticipantInput:
      type: object
      required: [staffId]
      properties:
        # Business the staff member works for. Defaults to the acting
        # business; for partnership rules it may be either partner.
        tenantId:
          type: integer
        staffId:
          type: integer
        role:
          type: string
        # percentage method only — must sum to 100 across participants.
        percent:
          type: integer
          minimum: 1
          maximum: 100
        # role_weighted method only — positive weight.
        weight:
          type: integer
          minimum: 1

    TipPoolRule:
      type: object
      required: [id, tenantId, scope, partnershipId, partnerTenantName, splitMethod, isActive, participants, createdAt]
      properties:
        id:
          type: integer
        # Business that owns (created) the rule.
        tenantId:
          type: ["integer", "null"]
        scope:
          type: string
          enum: [partnership, group_event]
        partnershipId:
          type: ["integer", "null"]
        # For partnership rules: the OTHER business's name from the acting
        # business's point of view (null for group_event rules).
        partnerTenantName:
          type: ["string", "null"]
        splitMethod:
          type: string
          enum: [percentage, equal, role_weighted]
        isActive:
          type: boolean
        participants:
          type: array
          items:
            $ref: "#/components/schemas/TipPoolParticipant"
        createdAt:
          type: string

    TipPoolRuleInput:
      type: object
      required: [scope, splitMethod, participants]
      properties:
        scope:
          type: string
          enum: [partnership, group_event]
        # Required for partnership scope.
        partnershipId:
          type: integer
        splitMethod:
          type: string
          enum: [percentage, equal, role_weighted]
        participants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TipPoolParticipantInput"

    TipPoolRuleUpdate:
      type: object
      properties:
        splitMethod:
          type: string
          enum: [percentage, equal, role_weighted]
        participants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TipPoolParticipantInput"
        isActive:
          type: boolean

    TipPoolPartnerStaff:
