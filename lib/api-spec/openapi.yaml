          enum: [discovery, booking_confirmation]
        pricingType:
          type: string
          enum: [flat, bid]
        amount:
          type: number
          exclusiveMinimum: 0
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

