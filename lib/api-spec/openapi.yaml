          description: Live surge boost — when present, the perk shows the elevated discount and limited-time indicator until expiresAt.
        featured:
          type: boolean
          description: True while this perk's partnership holds an active paid featured boost for the surface being rendered; featured perks sort above organic ones.

    CoopFeaturedBoost:
      type: object
      required:
        [id, tenantId, partnershipId, perkTitle, partnerName, surface, pricingType, amount, startsAt, endsAt, status, paymentMode, paymentRef, paymentFailureReason, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
          description: Sponsoring business.
        partnershipId:
          type: integer
        perkTitle:
          type: string
        partnerName:
          type: string
          description: The other side of the sponsored partnership.
        surface:
          type: string
          enum: [discovery, booking_confirmation]
        pricingType:
          type: string
          enum: [flat, bid]
        amount:
          type: number
        startsAt:
          type: string
        endsAt:
          type: string
        status:
          type: string
          enum: [pending, active, lost, expired]
          description: Flat purchases are active from purchase; bids stay pending until the window's auction resolves (highest bid wins, losers become lost); active boosts expire automatically after endsAt.
        paymentMode:
          type: string
          enum: [simulated, stripe]
          description: Whether this boost is backed by a real Stripe charge/hold or by simulated internal accounting (Stripe unconfigured).
        paymentRef:
          type: ["string", "null"]
          description: Stripe PaymentIntent id backing this boost (null in simulated mode).
        paymentFailureReason:
          type: ["string", "null"]
          description: Human-readable reason when a Stripe charge, capture, or hold release failed.
        createdAt:
          type: string

