    SosSettings:
      type: object
      required: [id, businessName, industryType, resourceLabel, openTime, closeTime, aiReceptionistEnabled, waitlistAutoFillEnabled, serviceNames, noShowShieldEnabled, noShowShieldProvisioned, noShowDepositAmount, noShowCancellationWindowHours, noShowFee, defaultCycleDays, seoDescription, publicPhone, streetAddress, addressLocality, addressRegion, postalCode, latitude, longitude, businessCategory, densityClassification, coopRadiusAutoMiles, coopRadiusOverrideMiles, coopRadiusEffectiveMiles, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        openTime:
          type: string
          description: Daily opening time ("HH:MM", 24h) used to compute public booking slots.
        closeTime:
          type: string
          description: Daily closing time ("HH:MM", 24h) used to compute public booking slots.
        serviceNames:
          type: string
          description: Comma-separated list of the business's own service names.
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: ["string", "null"]
        smsMode:
          type: string
          enum: [live, simulated]
        smsActiveFromNumber:
          type: ["string", "null"]
        smsInboundWebhookUrl:
          type: ["string", "null"]
        smsInboundReady:
          type: boolean
        noShowShieldEnabled:
          type: boolean
        noShowShieldProvisioned:
          type: boolean
          description: Whether the No-Show Shield module is provisioned — the policy only enforces when provisioned AND enabled.
        noShowDepositAmount:
          type: number
        noShowCancellationWindowHours:
          type: integer
        noShowFee:
          type: number
        defaultCycleDays:
          type: integer
          description: Fallback visit cycle (days) used by the rebooking-nudge scan for clients with too little visit history.
        seoDescription:
          type: string
          description: Public business description used in landing-page metadata and JSON-LD.
        publicPhone:
          type: string
          description: Public-facing phone number (distinct from the SMS sending number).
        streetAddress:
          type: string
        addressLocality:
          type: string
          description: City.
        addressRegion:
          type: string
          description: State / province.
        postalCode:
          type: string
        latitude:
          type: string
          description: Decimal latitude as a string; empty when unset.
        longitude:
          type: string
          description: Decimal longitude as a string; empty when unset.
        businessCategory:
          type: string
          description: Schema.org LocalBusiness subtype (e.g. HairSalon, AutoRepair); empty falls back to LocalBusiness.
        coopSubCategory:
          type: string
          description: Effective Level 2 co-op sub-category key (explicit or auto-derived from the business category); empty when unclassifiable.
        coopRadiusMiles:
          type: integer
          description: Co-op local discovery radius in miles (1–15).
        densityClassification:
          type: string
          enum: [dense_urban, suburban, rural]
          description: Auto-detected commercial density around the business address. Suburban is the fallback when detection can't run.
        coopRadiusAutoMiles:
          type: number
          description: Auto-assigned co-op cross-promotion radius (miles) from the density classification.
        coopRadiusOverrideMiles:
          type: ["number", "null"]
          description: Merchant override of the co-op radius (miles). Null = automatic.
        coopRadiusEffectiveMiles:
          type: number
          description: Effective co-op radius — the override when set, else the auto default.
        coopReciprocityMarginPercent:
          type: ["integer", "null"]
          description: Co-op reciprocity disparity margin (%); null = imbalance flagging off.
        coopReciprocityWindowDays:
          type: integer
          description: Evaluation window (days) for co-op reciprocity flagging.
        updatedAt:
          type: string

    SosSettingsUpdate:
      type: object
      properties:
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        openTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        closeTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        serviceNames:
          type: string
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: string
        noShowShieldEnabled:
          type: boolean
        noShowDepositAmount:
          type: number
          minimum: 0
        noShowCancellationWindowHours:
          type: integer
          minimum: 0
        noShowFee:
          type: number
          minimum: 0
        defaultCycleDays:
          type: integer
          minimum: 1
        seoDescription:
          type: string
        publicPhone:
          type: string
        streetAddress:
          type: string
        addressLocality:
          type: string
        addressRegion:
          type: string
        postalCode:
          type: string
        latitude:
          type: string
          pattern: "^$|^-?\\d{1,2}(\\.\\d+)?$"
        longitude:
          type: string
          pattern: "^$|^-?\\d{1,3}(\\.\\d+)?$"
        businessCategory:
          type: string
        coopSubCategory:
          type: string
          description: Curated Level 2 sub-category slug; empty string switches back to auto-derivation.
        coopRadiusMiles:
          type: integer
          minimum: 1
          maximum: 15
        coopRadiusOverrideMiles:
          type: ["number", "null"]
          minimum: 0.5
          maximum: 50
          description: Merchant override of the co-op radius (miles). Send null to revert to automatic.
        coopReciprocityMarginPercent:
          type: ["integer", "null"]
          minimum: 0
          maximum: 100
        coopReciprocityWindowDays:
