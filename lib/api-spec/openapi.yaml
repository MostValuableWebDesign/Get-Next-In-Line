    Tenant:
      type: object
      required: [id, brandName, subdomain, status, mrr, modulesEnabled, createdAt]
      properties:
        id:
          type: integer
        brandName:
          type: string
        subdomain:
          type: string
        status:
          type: string
          enum: [active, suspended, pending]
        mrr:
          type: number
        modulesEnabled:
          type: integer
        contactEmail:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        payoutStripeAccountId:
          type: ["string", "null"]
          description: Stripe Connect account id used as the settlement payout destination. Null = simulated payouts.
        createdAt:
          type: string

    TenantInput:
      type: object
      required: [brandName, subdomain]
      properties:
        brandName:
          type: string
          minLength: 1
          maxLength: 120
        subdomain:
          type: string
          minLength: 1
          maxLength: 63
        contactEmail:
          type: string
          # Email shape check kept as a pattern: the repo's zod v3 doesn't
          # support orval's generated z.email() for `format: email`.
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        contactName:
          type: string
          maxLength: 120
        status:
          type: string
          enum: [active, suspended, pending]

    TenantUpdate:
      type: object
      properties:
        brandName:
          type: string
          minLength: 1
          maxLength: 120
        subdomain:
          type: string
          minLength: 1
          maxLength: 63
        status:
          type: string
          enum: [active, suspended, pending]
        contactEmail:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        contactName:
          type: string
          maxLength: 120
        payoutStripeAccountId:
          type: ["string", "null"]

