    CoopPartnership:
      type: object
      required:
        [
          id,
          hostTenantId,
          hostTenantName,
          partnerTenantId,
          partnerTenantName,
          perkTitle,
          perkDescription,
          redemptionCode,
          industryBarrierOverridden,
          status,
          requestedByTenantId,
          mutualRewardTerms,
          perkValueAmount,
          perkStartsAt,
          perkEndsAt,
          disputeSuspended,
          bannedAt,
          hostTrackingCode,
          partnerTrackingCode,
          tier,
          hostReciprocityThreshold,
          partnerReciprocityThreshold,
          performancePausedAt,
          reactivationRequestedByTenantId,
          proposedPerkTitle,
          proposedPerkDescription,
          proposedMutualRewardTerms,
          renegotiationRequestedByTenantId,
          isActive,
          revenueShareKind,
          revenueShareValue,
          revenueShareBaseAmount,
          usageLimitKind,
          usageCap,
          createdAt,
        ]
      properties:
        id:
          type: integer
        hostTenantId:
          type: integer
        hostTenantName:
          type: string
        partnerTenantId:
          type: integer
        partnerTenantName:
          type: string
        perkTitle:
          type: string
        perkDescription:
          type: ["string", "null"]
        redemptionCode:
          type: string
        industryBarrierOverridden:
          type: boolean
        status:
          type: string
          enum: [pending, accepted, declined]
          description: Invite lifecycle; admin-created partnerships are accepted from the start.
        requestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that initiated the invite; null for admin-created partnerships.
        mutualRewardTerms:
          type: ["string", "null"]
        perkValueAmount:
          type: ["number", "null"]
          description: Estimated monetary value of the perk in dollars; when set, counted redemptions are logged in the co-op tax compliance ledger.
        perkStartsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk goes live; null = active immediately.
        perkEndsAt:
          type: ["string", "null"]
          description: ISO timestamp the perk expires; null = never expires.
        disputeSuspended:
          type: boolean
          description: True when an escalated dispute paused the perk and hid the partnership until an admin reinstates it.
        bannedAt:
          type: ["string", "null"]
          description: Set when a platform admin permanently banned the partnership.
        hostTrackingCode:
          type: ["string", "null"]
          description: Tracking code carried by the host's customers (host→partner traffic); null only until backfilled.
        partnerTrackingCode:
          type: ["string", "null"]
          description: Tracking code carried by the partner's customers (partner→host traffic); null only until backfilled.
        tier:
          type: string
          enum: [premier, standard]
          description: Performance-based tier, evaluated against rolling 30-day attribution counts.
        hostReciprocityThreshold:
          type: ["integer", "null"]
          description: Customers/30 days the host demands of partner→host traffic; null = platform default (5).
        partnerReciprocityThreshold:
          type: ["integer", "null"]
          description: Customers/30 days the partner demands of host→partner traffic; null = platform default (5).
        performancePausedAt:
          type: ["string", "null"]
          description: Set when the evaluator paused the partnership for zero 30-day traffic; the perk is hidden from all customer surfaces while set.
        reactivationRequestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that requested reactivation of a performance pause; cleared when the pause lifts.
        proposedPerkTitle:
          type: ["string", "null"]
          description: Pending re-negotiation perk title; null when no proposal is pending.
        proposedPerkDescription:
          type: ["string", "null"]
        proposedMutualRewardTerms:
          type: ["string", "null"]
        renegotiationRequestedByTenantId:
          type: ["integer", "null"]
          description: Tenant that proposed the pending re-negotiation; null when none is pending.
        isActive:
          type: boolean
        revenueShareKind:
          type: ["string", "null"]
          enum: [bounty, percent, null]
          description: Optional revenue-share terms — flat referral bounty or percentage split; null = classic mutual-perk pact with no money movement.
        revenueShareValue:
          type: ["number", "null"]
          description: Bounty dollars (kind=bounty) or split percent (kind=percent).
        revenueShareBaseAmount:
          type: ["number", "null"]
          description: Agreed nominal transaction value a percentage split applies to; null unless kind=percent.
        usageLimitKind:
          type: string
          enum: [unlimited, per_customer, total_cap]
          description: How often the redemption code may be redeemed — unlimited (default), one counted redemption per customer, or a total redemption cap.
        usageCap:
          type: ["integer", "null"]
          description: Total redemption cap; set only when usageLimitKind=total_cap.
        createdAt:
          type: string

