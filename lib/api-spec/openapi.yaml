      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Handshake initiated — connection is pending authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectResult"
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/callback:
    post:
      operationId: completePartnerAuthorization
      tags: [partners]
      summary: OAuth authorization callback — exchanges the code and activates the connection
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerCallbackBody"
      responses:
        "200":
          description: Connection activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "400":
          description: Invalid or expired handshake state
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/status:
    get:
      operationId: getPartnerConnectionStatus
      tags: [partners]
      summary: Connection status, last sync, and audit history for a partner
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection status with recent audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "404":
          description: Partner not found

  /v1/partners/{partnerId}/disconnect:
    post:
      operationId: disconnectPartner
      tags: [partners]
      summary: Disconnect a partner integration and purge stored credentials
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Connection disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerConnectionStatus"
        "404":
          description: Partner not found

  /gateway/tokens:
    get:
      operationId: listGatewayTokens
      tags: [gateway]
      summary: List the tenant's Co-Op API gateway tokens (masked — full values are never recoverable)
      responses:
        "200":
          description: Gateway API tokens, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayToken"
    post:
      operationId: createGatewayToken
      tags: [gateway]
      summary: Create a gateway API token — the full token value is returned exactly once and stored only as a one-way hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGatewayTokenRequest"
      responses:
        "201":
          description: Token created — save the token value now, it cannot be shown again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTokenWithSecret"

  /gateway/tokens/{id}/rotate:
    post:
      operationId: rotateGatewayToken
      tags: [gateway]
      summary: Rotate a token in place — the old value stops working instantly; the new value is shown exactly once
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayTokenWithSecret"
        "404":
          description: Token not found in this tenant scope
        "409":
          description: Revoked tokens cannot be rotated

  /gateway/tokens/{id}/revoke:
    post:
      operationId: revokeGatewayToken
      tags: [gateway]
      summary: Revoke a token — external callers using it are rejected from that moment on
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayToken"
        "404":
          description: Token not found in this tenant scope

  /gateway/calls:
    get:
      operationId: listGatewayCalls
      tags: [gateway]
      summary: Merchant-viewable log of public gateway API calls (newest first, up to 100), including rejected attempts
      responses:
        "200":
          description: Gateway API call log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GatewayApiCall"

  /public/booking/{slug}:
    get:
      operationId: getPublicBookingConfig
