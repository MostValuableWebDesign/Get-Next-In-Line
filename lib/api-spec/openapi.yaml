          $ref: "#/components/schemas/CoopLedgerCounts"
        allTime:
          $ref: "#/components/schemas/CoopLedgerCounts"
        ratio:
          type: ["number", "null"]
          description: inbound / outbound over the window; null when outbound is 0.
        disparityPercent:
          type: number
          description: "|inbound − outbound| / max(inbound, outbound) × 100 over the evaluation window; 0 when there is no traffic."
        flagged:
          type: boolean
          description: True when the tenant's reciprocity threshold is set and this partnership's disparity exceeds it.

    CoopLedgerResponse:
      type: object
      required: [windowDays, evaluationWindowDays, marginPercent, entries]
      properties:
        windowDays:
          type: integer
          description: Recent-window size the window counts cover.
        evaluationWindowDays:
          type: integer
          description: Window used for threshold flagging (the tenant's configured evaluation window).
        marginPercent:
          type: ["integer", "null"]
          description: The tenant's configured disparity margin; null = flagging off.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CoopLedgerEntry"

    CoopDirectoryEntry:
      type: object
      required: [id, name, category, subCategory, industry, distanceMiles, city, sameIndustry, samePlaza, plazaConflict, featured]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: ["string", "null"]
        subCategory:
          type: ["string", "null"]
          description: Curated Level 2 sub-category label; null when the business is unclassified.
        industry:
          type: ["string", "null"]
          description: Curated Level 1 industry label; null when the business is unclassified.
        distanceMiles:
          type: ["number", "null"]
          description: Distance from the requesting business in miles; null when either side lacks coordinates.
        city:
          type: ["string", "null"]
        sameIndustry:
          type: boolean
          description: True when this business shares the requester's Level 1 industry (different sub-niche — pairing still allowed). Direct same-sub-category competitors never appear at all.
        samePlaza:
          type: boolean
          description: True when this business shares the requester's commercial complex (same address block + postal code, or lat/long proximity).
        plazaConflict:
          type: boolean
          description: True when inviting this business would violate plaza exclusivity — its category is already held by one of the requester's active same-plaza partnerships.
        featured:
          type: boolean
          description: True while this business holds an active paid featured boost for the discovery surface; featured entries sort above organic matches.
        capacityStatus:
          type: ["string", "null"]
          enum: [available, moderate, busy, null]
          description: The business's live capacity status; null when unavailable.

    CoopCapacityStatus:
      type: object
      required: [status, source, waitMinutes, appointmentsToday, capacityThreshold, manualStatus, overrideExpiresAt]
      properties:
        status:
          type: string
          enum: [available, moderate, busy]
        source:
          type: string
          enum: [manual, auto]
          description: manual — merchant override in force; auto — derived from live queue wait, bookings vs. threshold, and resource occupancy.
        waitMinutes:
          type: number
          description: Highest live wait estimate (minutes) among queued visits.
        appointmentsToday:
          type: integer
        capacityThreshold:
          type: ["integer", "null"]
        manualStatus:
          type: ["string", "null"]
        overrideExpiresAt:
          type: ["string", "null"]

    CoopCapacityUpdate:
      type: object
      properties:
        capacityThreshold:
          type: ["integer", "null"]
          minimum: 0
          description: Daily appointment capacity threshold; null clears it.
        manualStatus:
          type: ["string", "null"]
          enum: [available, moderate, busy, null]
          description: Manual live status; null reverts to automatic derivation.
        overrideMinutes:
          type: ["integer", "null"]
          minimum: 0
          description: Minutes the manual status holds before auto-reverting; null/0 = until cleared.

