                $ref: "#/components/schemas/WalletPassList"
        "401":
          description: Missing or expired wallet session

  /wallet/passes/{id}:
    get:
      operationId: getWalletPass
      tags: [wallet]
      summary: One perk pass with its QR payload (wallet session cookie)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletPassDetail"
