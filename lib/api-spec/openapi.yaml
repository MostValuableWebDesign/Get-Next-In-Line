      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletLoginRequest"
      responses:
        "200":
          description: Code sent (or simulated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletLoginRequestResult"
        "400":
          description: Invalid phone number
        "429":
          description: Too many code requests

  /wallet/login/verify:
    post:
      operationId: verifyWalletLoginCode
      tags: [wallet]
      summary: Exchange a received SMS code for a wallet session — issued as an HttpOnly cookie (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletLoginVerify"
      responses:
        "200":
          description: Verified — wallet session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSessionResult"
        "400":
          description: Wrong, expired, or missing code
        "429":
          description: Too many verification attempts

  /wallet/session:
    get:
      operationId: getWalletSession
      tags: [wallet]
      summary: Who-am-I for the wallet — returns the signed-in phone when the wallet session cookie is valid (public)
      responses:
        "200":
          description: A wallet session is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSessionResult"
        "401":
          description: Missing or expired wallet session

  /wallet/logout:
    post:
      operationId: logoutWallet
      tags: [wallet]
      summary: Sign out of the wallet — invalidates the session row server-side and clears the HttpOnly cookie (public, idempotent)
      responses:
        "200":
