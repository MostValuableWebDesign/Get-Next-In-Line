          type: string
          description: Stable synthetic id, e.g. "call-3", "sms-7", "concierge-4"
        channel:
          type: string
          enum: [ai_call, sms, concierge]
        kind:
          type: string
          description: Source-specific kind (call outcome, message kind, or concierge job type)
        direction:
          type: string
          enum: [inbound, outbound]
        status:
          type: string
        timestamp:
          type: string
        body:
