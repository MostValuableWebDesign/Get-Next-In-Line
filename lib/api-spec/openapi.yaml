  /operations/integrations/gusto/connect:
    post:
      operationId: connectGusto
      tags: [operations]
      summary: Start tenant-scoped Gusto OAuth authorization
      responses:
        "200":
          description: Gusto authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GustoConnectResult"
        "400":
          description: Tenant scope is required
        "503":
          description: Gusto OAuth is not configured

  /operations/integrations/gusto/callback:
    get:
      operationId: completeGustoOAuth
      tags: [operations]
      summary: Complete Gusto OAuth authorization using one-time state
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the Operations integration catalog
        "400":
          description: Invalid, expired, or replayed OAuth state

  /operations/integrations/gusto/status:
    get:
      operationId: getGustoConnectionStatus
      tags: [operations]
      summary: Get the tenant's Gusto connection status
      responses:
        "200":
          description: Gusto connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GustoConnectionStatus"
        "400":
          description: Tenant scope is required

  /operations/integrations/gusto/disconnect:
    post:
      operationId: disconnectGusto
      tags: [operations]
      summary: Disconnect Gusto and remove stored credentials
      responses:
        "200":
          description: Gusto was disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GustoDisconnectResult"
        "400":
          description: Tenant scope is required

  /operations/integrations/gusto/reconcile:
    post:
      operationId: reconcileGusto
      tags: [operations]
      summary: Retry tenant-scoped Gusto capability setup using stored credentials
      responses:
        "200":
          description: Gusto capability ownership reconciliation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GustoReconciliationResult"
        "400":
          description: Tenant scope is required
        "409":
          description: Gusto has no usable connected or degraded connection
        "500":
          description: Capability setup could not be completed

  /operations/integrations/gusto/sync:
    post:
      operationId: syncGustoWorkforce
      tags: [operations]
      summary: Synchronize tenant workforce records from Gusto
      responses:
        "200":
          description: Idempotent workforce synchronization counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkforceSyncResult"
        "409":
          description: Gusto is disconnected or does not own the employees capability

  /operations/integrations/gusto/sync/payroll:
    post:
      operationId: syncGustoPayrollReadOnly
      tags: [operations]
      summary: Synchronize read-only processed and unprocessed payroll runs from Gusto
      responses:
        "200":
          description: Payroll synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsCapabilitySyncResult"
        "409":
          description: Gusto is disconnected or does not own the payroll capability

  /operations/integrations/gusto/sync/compensation:
    post:
      operationId: syncGustoCompensationReadOnly
      tags: [operations]
      summary: Synchronize read-only current job compensation from Gusto
      responses:
        "200":
          description: Compensation synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsCapabilitySyncResult"
        "409":
          description: Gusto is disconnected or does not own the compensation capability

  /operations/payroll:
    get:
      operationId: listOperationsPayroll
      tags: [operations]
      summary: List normalized read-only payroll runs for the tenant
      responses:
        "200":
          description: Normalized payroll runs without provider payloads or external identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsPayrollRun"

  /operations/compensation:
    get:
      operationId: listOperationsCompensation
      tags: [operations]
      summary: List normalized read-only current compensation for the tenant
      responses:
        "200":
          description: Normalized compensation without provider payloads or external identifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsCompensation"

  /operations/workforce:
    get:
      operationId: listOperationsWorkforce
      tags: [operations]
      summary: List normalized provider workforce records and GNIL linkage
      responses:
        "200":
          description: Tenant workforce records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationsWorkforcePerson"

  /operations/workforce/{personId}/link:
    put:
      operationId: linkOperationsWorkforcePerson
      tags: [operations]
      summary: Link or unlink an imported person to a tenant GNIL staff member or resource
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkforceStaffLinkRequest"
      responses:
        "200":
          description: Link state
          content:
            application/json:
              schema:
                type: object
                required: [linked]
