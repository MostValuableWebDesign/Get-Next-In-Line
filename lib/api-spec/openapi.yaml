      properties:
        mapping:
          $ref: "#/components/schemas/ConnectorRegistryEntry"
        description:
          type: string
        wholesalePrice:
          type: number
        resalePrice:
          type: number
        markupPercent:
          type: number
        # Optional bi-weekly cadence resale rate — present only for modules
        # that also offer bi-weekly billing.
        resalePriceBiweekly:
          type: number
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/AdminModuleTenantAssignment"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/TenantActivity"

    ModulePricing:
      type: object
      required: [id, name, category, wholesalePrice, resalePrice, markupPercent, margin]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        wholesalePrice:
          type: number
        resalePrice:
          type: number
        markupPercent:
          type: number
        margin:
          type: number
        # Optional bi-weekly cadence breakdown — present only for modules
        # that also offer bi-weekly billing (distinct rate, not monthly/2).
        wholesalePriceBiweekly:
          type: number
        resalePriceBiweekly:
          type: number
        marginBiweekly:
          type: number

    BillingSummary:
      type: object
      required: [totalMrr, byCategory, topTenants]
      properties:
        totalMrr:
          type: number
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryRevenue"
        topTenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantBillingSummary"

    TenantBillingSummary:
      type: object
      required: [tenantId, brandName, mrr]
      properties:
        tenantId:
          type: integer
        brandName:
          type: string
        mrr:
          type: number

    ModuleTenantCount:
      type: object
      required: [moduleId, activeTenantCount]
      properties:
        moduleId:
          type: integer
        activeTenantCount:
          type: integer

    ModuleTenantSubscriber:
      type: object
      required: [tenantId, brandName, subdomain, status, billingCadence, provisionedAt]
      properties:
        tenantId:
          type: integer
        brandName:
          type: string
        subdomain:
          type: string
        status:
          type: string
          enum: [active, suspended, pending]
        billingCadence:
          type: string
          enum: [monthly, biweekly]
        provisionedAt:
          type: string

    CheckoutInput:
      type: object
      required: [tenantId, moduleIds]
      properties:
        tenantId:
          type: integer
        moduleIds:
          type: array
          items:
            type: integer
        applyMarkup:
          type: boolean
        # Optional per-module billing cadence overrides. Modules not listed
        # default to monthly. Only valid for modules that offer a bi-weekly rate.
        moduleCadences:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCadenceSelection"

    ModuleCadenceSelection:
      type: object
      required: [moduleId, cadence]
      properties:
        moduleId:
          type: integer
        cadence:
          type: string
          enum: [monthly, biweekly]

    CheckoutResult:
      type: object
      required: [success, transactionId, totalWholesale, totalResale, margin, modulesProvisioned, message]
      properties:
        success:
          type: boolean
        transactionId:
          type: string
        totalWholesale:
          type: number
        totalResale:
          type: number
        margin:
          type: number
        modulesProvisioned:
          type: integer
        modulesSkipped:
          type: integer
        message:
          type: string
