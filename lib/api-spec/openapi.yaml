    SosTwilioWebhookStatus:
      type: object
      required: [status, phoneNumber, expectedUrl, configuredUrl, voiceStatus, expectedVoiceUrl, configuredVoiceUrl, errorMessage]
      properties:
        status:
          type: string
          enum: [configured, misconfigured, no_credentials, no_public_url, no_number, number_not_found, error]
          description: Result of the live Twilio console check. "configured" means the number's "A message comes in" URL matches the app's inbound webhook.
        phoneNumber:
          type: ["string", "null"]
          description: The E.164 SMS number whose Twilio configuration was checked.
        expectedUrl:
          type: ["string", "null"]
          description: The inbound webhook URL the app expects Twilio to point at.
        configuredUrl:
          type: ["string", "null"]
          description: The URL currently configured on the number in the Twilio console, when reachable.
        voiceStatus:
          type: string
          enum: [configured, misconfigured, no_credentials, no_public_url, no_number, number_not_found, error]
          description: Result of the same check for the number's "A call comes in" (VoiceUrl) webhook — the AI receptionist's inbound call entry point. Precondition failures mirror `status`.
        expectedVoiceUrl:
          type: ["string", "null"]
          description: The inbound voice webhook URL the app expects Twilio's VoiceUrl to point at.
        configuredVoiceUrl:
          type: ["string", "null"]
          description: The VoiceUrl currently configured on the number in the Twilio console, when reachable.
        errorMessage:
          type: ["string", "null"]

    SosTwilioWebhookConfigureRequest:
      type: object
      properties:
        target:
          type: string
          enum: [sms, voice]
          default: sms
          description: Which webhook on the number to fix — the SMS "A message comes in" URL (default) or the voice "A call comes in" URL.

    SosTwilioWebhookConfigureResult:
      type: object
      required: [fixed, check, errorMessage]
      properties:
        fixed:
          type: boolean
          description: True when the Twilio number's webhook URL was successfully updated to the app's inbound URL.
        check:
          $ref: "#/components/schemas/SosTwilioWebhookStatus"
        errorMessage:
          type: ["string", "null"]
          description: Human-readable reason when the fix could not be applied.

    SosSettings:
      type: object
      required: [id, businessName, industryType, resourceLabel, openTime, closeTime, aiReceptionistEnabled, waitlistAutoFillEnabled, serviceNames, noShowShieldEnabled, noShowShieldProvisioned, noShowDepositAmount, noShowCancellationWindowHours, noShowFee, defaultCycleDays, seoDescription, publicPhone, streetAddress, addressLocality, addressRegion, postalCode, latitude, longitude, businessCategory, densityClassification, coopRadiusAutoMiles, coopRadiusOverrideMiles, coopRadiusEffectiveMiles, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        openTime:
          type: string
          description: Daily opening time ("HH:MM", 24h) used to compute public booking slots.
        closeTime:
          type: string
          description: Daily closing time ("HH:MM", 24h) used to compute public booking slots.
        serviceNames:
          type: string
          description: Comma-separated list of the business's own service names.
        aiReceptionistEnabled:
          type: boolean
        waitlistAutoFillEnabled:
          type: boolean
        smsFromNumber:
          type: ["string", "null"]
        smsMode:
          type: string
          enum: [live, simulated]
        smsActiveFromNumber:
          type: ["string", "null"]
          description: The From number live sends will actually use, after ignoring placeholder overrides.
        smsActiveFromNumberSource:
          type: ["string", "null"]
          enum: [settings, connector, env, null]
          description: Where the active From number comes from — the settings override, the Twilio connector, or the environment.
        smsIgnoredFromNumber:
          type: ["string", "null"]
          description: A stored From-number override that is being ignored because it is a placeholder or unparsable.
        smsInboundWebhookUrl:
          type: ["string", "null"]
        smsInboundReady:
          type: boolean
        smsDeliveryStatusMode:
          type: string
          enum: [callbacks, polling, none]
          description: >-
            How per-message delivery status (delivered/failed) reaches the app.
            "callbacks" — Twilio StatusCallback webhooks are signature-verified with
            the raw auth token. "polling" — SMS goes through the Replit Twilio
            connector (auth token withheld), so statuses are reconciled by polling
            Twilio's API. "none" — simulated mode, nothing to track.
        smsTestRecipient:
          type: string
          description: Configured default recipient for admin test texts (TEST_SMS_RECIPIENT env var, platform default otherwise).
        noShowShieldEnabled:
          type: boolean
        noShowShieldProvisioned:
          type: boolean
          description: Whether the No-Show Shield module is provisioned — the policy only enforces when provisioned AND enabled.
        noShowDepositAmount:
          type: number
        noShowCancellationWindowHours:
          type: integer
        noShowFee:
          type: number
        defaultCycleDays:
          type: integer
          description: Fallback visit cycle (days) used by the rebooking-nudge scan for clients with too little visit history.
        seoDescription:
          type: string
          description: Public business description used in landing-page metadata and JSON-LD.
        publicPhone:
          type: string
          description: Public-facing phone number (distinct from the SMS sending number).
        streetAddress:
          type: string
        addressLocality:
          type: string
          description: City.
        addressRegion:
          type: string
          description: State / province.
        postalCode:
          type: string
        latitude:
          type: string
          description: Decimal latitude as a string; empty when unset.
        longitude:
          type: string
          description: Decimal longitude as a string; empty when unset.
        businessCategory:
          type: string
          description: Schema.org LocalBusiness subtype (e.g. HairSalon, AutoRepair); empty falls back to LocalBusiness.
        coopSubCategory:
          type: string
          description: Effective Level 2 co-op sub-category key (explicit or auto-derived from the business category); empty when unclassifiable.
        coopRadiusMiles:
          type: integer
          description: Co-op local discovery radius in miles (1–15).
        densityClassification:
          type: string
          enum: [dense_urban, suburban, rural]
          description: Auto-detected commercial density around the business address. Suburban is the fallback when detection can't run.
        coopRadiusAutoMiles:
          type: number
          description: Auto-assigned co-op cross-promotion radius (miles) from the density classification.
        coopRadiusOverrideMiles:
          type: ["number", "null"]
          description: Merchant override of the co-op radius (miles). Null = automatic.
        coopRadiusEffectiveMiles:
          type: number
          description: Effective co-op radius — the override when set, else the auto default.
        coopReciprocityMarginPercent:
          type: ["integer", "null"]
          description: Co-op reciprocity disparity margin (%); null = imbalance flagging off.
        coopReciprocityWindowDays:
          type: integer
          description: Evaluation window (days) for co-op reciprocity flagging.
        brandLogoUrl:
          type: string
          description: Marketing branding logo as a data URL; empty when unset.
        brandPrimaryColor:
          type: string
        brandSecondaryColor:
          type: string
        updatedAt:
          type: string

    SosSettingsUpdate:
      type: object
      properties:
        businessName:
          type: string
        industryType:
          type: string
        resourceLabel:
          type: string
        openTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        closeTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        serviceNames:
          type: string
