  /wallet/ambassador/referral:
    post:
      operationId: enterWalletReferralCode
      tags: [wallet]
      summary: Enter a friend's referral code as the signed-in customer; both parties earn network-wide rewards once a qualifying visit converts the referral (wallet session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletReferralEnterBody"
      responses:
        "200":
          description: Referral attached (pending conversion)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAmbassadorView"
        "400":
          description: Invalid body
        "401":
          description: Missing or expired wallet session
        "409":
          description: Unknown code, self-referral, already referred, or already active on the network

