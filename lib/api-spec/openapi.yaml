      type: object
      required: [tenantId, brandName, mrr]
      properties:
        tenantId:
          type: integer
        brandName:
          type: string
        mrr:
          type: number

    ModuleTenantCount:
      type: object
      required: [moduleId, activeTenantCount]
      properties:
        moduleId:
          type: integer
        activeTenantCount:
          type: integer

    ModuleTenantSubscriber:
      type: object
      required: [tenantId, brandName, subdomain, status, billingCadence, provisionedAt]
      properties:
        tenantId:
          type: integer
        brandName:
          type: string
        subdomain:
          type: string
        status:
          type: string
          enum: [active, suspended, pending]
        billingCadence:
          type: string
          enum: [monthly, biweekly]
        provisionedAt:
          type: string

    CheckoutInput:
      type: object
      required: [tenantId, moduleIds]
      properties:
        tenantId:
          type: integer
        moduleIds:
          type: array
          items:
            type: integer
        applyMarkup:
          type: boolean
        # Optional per-module billing cadence overrides. Modules not listed
        # default to monthly. Only valid for modules that offer a bi-weekly rate.
        moduleCadences:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCadenceSelection"

    ModuleCadenceSelection:
      type: object
      required: [moduleId, cadence]
      properties:
        moduleId:
          type: integer
        cadence:
          type: string
          enum: [monthly, biweekly]

    CheckoutResult:
      type: object
      required: [success, transactionId, totalWholesale, totalResale, margin, modulesProvisioned, message]
      properties:
        success:
          type: boolean
        transactionId:
          type: string
        totalWholesale:
          type: number
        totalResale:
          type: number
        margin:
          type: number
        modulesProvisioned:
          type: integer
        modulesSkipped:
          type: integer
        message:
          type: string

    EmergencyBroadcast:
      type: object
      required:
        [
          id,
          senderTenantId,
          senderName,
          scope,
          severity,
          alertType,
          headline,
          message,
          status,
          resolvedAt,
          targetCount,
          checkedInCount,
          smsSentCount,
          myCheckinStatus,
          myCheckinNote,
          roster,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        senderTenantId:
          type: ["integer", "null"]
          description: NULL when a platform admin sent the broadcast.
        senderName:
          type: string
          description: Sender business name, or "Platform Administration" for admin broadcasts.
        scope:
          type: string
          enum: [network, platform, selected]
        severity:
          type: string
          enum: [info, warning, critical]
        alertType:
          type: string
          enum: [weather_closure, power_outage, safety_alert, schedule_change, other]
        headline:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [active, resolved]
        resolvedAt:
          type: ["string", "null"]
        targetCount:
          type: integer
        checkedInCount:
          type: integer
        smsSentCount:
          type: integer
          description: Subscriber SMS alerts recorded so far across all targets (sent or simulated).
        myCheckinStatus:
          type: ["string", "null"]
          description: The requesting tenant's own check-in status, when scoped and targeted.
        myCheckinNote:
          type: ["string", "null"]
        roster:
          type: array
          items:
            $ref: "#/components/schemas/EmergencyRosterEntry"
        createdAt:
          type: string
        updatedAt:
          type: string

    EmergencyRosterEntry:
      type: object
      required: [tenantId, tenantName, status, note, checkedInAt]
      properties:
        tenantId:
          type: integer
        tenantName:
          type: string
        status:
          type: ["string", "null"]
          description: open | temporarily_closed | safe — null while the tenant hasn't checked in yet.
        note:
          type: ["string", "null"]
        checkedInAt:
          type: ["string", "null"]

    EmergencyBroadcastCreate:
      type: object
      required: [severity, alertType, headline, message]
      properties:
        severity:
          type: string
          enum: [info, warning, critical]
        alertType:
          type: string
          enum: [weather_closure, power_outage, safety_alert, schedule_change, other]
        headline:
          type: string
          minLength: 1
          maxLength: 120
        message:
          type: string
          minLength: 1
          maxLength: 1000
        scope:
          type: string
          enum: [platform, selected]
          description: Admin-only targeting; merchant broadcasts always use their co-op network.
        targetTenantIds:
          type: array
          items:
            type: integer
          description: Required when scope is "selected".

    EmergencyCheckinCreate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, temporarily_closed, safe]
        note:
          type: ["string", "null"]
          maxLength: 300

    EmergencyCheckin:
      type: object
      required: [broadcastId, tenantId, status, note, updatedAt]
      properties:
        broadcastId:
          type: integer
        tenantId:
          type: integer
        status:
          type: string
          enum: [open, temporarily_closed, safe]
        note:
          type: ["string", "null"]
        updatedAt:
          type: string

    SafetyIncident:
      type: object
      required:
        [
          id,
          tenantId,
          tenantName,
          direction,
          incidentType,
          description,
          location,
          status,
          resolvedAt,
          acknowledgedAt,
          recipientCount,
          acknowledgedCount,
          smsSentCount,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
          description: Originating (raising) tenant.
        tenantName:
          type: string
        direction:
          type: string
          enum: [raised, received]
          description: Whether the requesting tenant raised or received this incident.
        incidentType:
          type: string
          enum: [silent_panic, suspicious_activity, safety_hazard, medical_emergency, severe_weather]
        description:
          type: string
          description: Decrypted incident text (stored encrypted at rest).
        location:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, resolved]
        resolvedAt:
          type: ["string", "null"]
        acknowledgedAt:
          type: ["string", "null"]
          description: When the requesting tenant acknowledged (received incidents only).
        recipientCount:
          type: integer
        acknowledgedCount:
          type: integer
        smsSentCount:
          type: integer
          description: Partner SMS notifications recorded for the broadcast (sent or simulated).
        createdAt:
          type: string
        updatedAt:
          type: string

    SafetyIncidentCreate:
      type: object
      required: [incidentType, description]
      properties:
        incidentType:
          type: string
          enum: [silent_panic, suspicious_activity, safety_hazard, medical_emergency, severe_weather]
        description:
          type: string
          minLength: 1
        location:
          type: ["string", "null"]

    SafetyIncidentUpdateCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    SafetyTimelineEntry:
      type: object
      required: [id, kind, actorTenantId, actorTenantName, body, createdAt]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [broadcast, update, acknowledgment, resolution]
        actorTenantId:
          type: integer
        actorTenantName:
          type: string
        body:
          type: ["string", "null"]
          description: Decrypted free text when the event carries one.
        createdAt:
          type: string

    SafetyEmergencyContact:
      type: object
      required: [id, label, phone, category, sortOrder, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        phone:
          type: string
        category:
