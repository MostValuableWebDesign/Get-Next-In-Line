            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicCheckInInput"
      responses:
        "201":
          description: Queue check-in created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckInConfirmation"
        "400":
          description: Invalid check-in or phone number
        "404":
          description: Active business or service not found
        "409":
