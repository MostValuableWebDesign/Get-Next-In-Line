        sortOrder:
          type: integer

    SafetyEmergencyContactUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        category:
          type: string
          enum: [law_enforcement, medical, property_management, other]
        sortOrder:
          type: integer

    SafetyBroadcastTemplate:
      type: object
      required: [id, title, incidentType, body, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        incidentType:
          type: string
          enum: [silent_panic, suspicious_activity, safety_hazard, medical_emergency, severe_weather]
        body:
          type: string
        createdAt:
          type: string

    SafetyBroadcastTemplateCreate:
      type: object
      required: [title, incidentType, body]
      properties:
