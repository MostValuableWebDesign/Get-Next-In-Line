kind = "web"
previewPath = "/sos-legacy/"
title = "SOS (retired — merged into GNIL OS)"
version = "1.0.0"
id = "artifacts/sos"
router = "path"

[[services]]
name = "web"
paths = [ "/sos-legacy/" ]
localPort = 22124

[services.development]
run = "pnpm --filter @workspace/sos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sos", "run", "build" ]
serve = "static"
publicDir = "artifacts/sos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22124"
BASE_PATH = "/sos-legacy/"
